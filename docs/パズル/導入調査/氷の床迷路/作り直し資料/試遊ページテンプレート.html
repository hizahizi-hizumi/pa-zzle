<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>氷の床迷路 試遊4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: 1画面に盤面を最大で置く。上に問題番号と計数、盤面の下にこの問題の決まり、待った類、体感。器は静か、盤面だけが氷の色 */
/* ===== 氷の床迷路 盤面（アプリ本体 IceFloorMazeBoard / ice-floor-maze-tone.ts を土台にした見本） =====
   1マス = 1単位の SVG 座標で描く。色は Tailwind の oklch 値（アプリの tone と同じ段階）。
   - 外壁・岩・もろい岩: 石の色（stone）。「ぶつかって止まる面」。
   - 氷・薄い氷・水面: 青の系統の明るさの段階。明るい＝滑れる、暗く沈んだ＝入れない。
   - 雪: 白い面。駒が入り込んで止まる、柔らかい地面。
   - ゴール: アンバー。駒: 白い縁取り（主駒は丸・インディゴ、相棒は四角・エメラルド）。 */
:root {
  --ifm-wall: oklch(70.9% 0.01 56.259);          /* stone-400 */
  --ifm-stone: oklch(70.9% 0.01 56.259);         /* stone-400 */
  --ifm-stone-shadow: oklch(55.3% 0.013 58.071); /* stone-500 */
  --ifm-ice: oklch(95.1% 0.026 236.824);         /* sky-100 */
  --ifm-joint: oklch(90.1% 0.058 230.902);       /* sky-200 */
  --ifm-thin: oklch(85.5% 0.085 231);            /* sky-200〜300 の間 */
  --ifm-thin-crack: oklch(100% 0 0);
  --ifm-water: oklch(58.8% 0.158 241.966);       /* sky-600 */
  --ifm-water-deep: oklch(50% 0.134 242.749);    /* sky-700 */
  --ifm-wave: oklch(90.1% 0.058 230.902 / 0.9);  /* sky-200 */
  --ifm-snow: oklch(100% 0 0);
  --ifm-snow-edge: oklch(78% 0.035 245);
  --ifm-snow-dot: oklch(88% 0.03 240);
  --ifm-goal-cell: oklch(96.2% 0.059 95.617);    /* amber-100 */
  --ifm-goal: oklch(76.9% 0.188 70.08);          /* amber-500 */
  --ifm-a: oklch(51.1% 0.262 276.966);           /* indigo-600 */
  --ifm-b: oklch(59.6% 0.145 163.225);           /* emerald-600 */
  --ifm-rim: oklch(100% 0 0);
  --ifm-trail-a: oklch(67.3% 0.182 276.935 / 0.45); /* indigo-400/45 */
  --ifm-trail-b: oklch(76.5% 0.177 163.223 / 0.5);  /* emerald-400/50 */
}
:root[data-theme="dark"] {
  --ifm-wall: oklch(55.3% 0.013 58.071);         /* stone-500 */
  --ifm-stone: oklch(55.3% 0.013 58.071);
  --ifm-stone-shadow: oklch(44.4% 0.011 73.639); /* stone-600 */
  --ifm-ice: oklch(27.9% 0.041 260.031);         /* slate-800 */
  --ifm-joint: oklch(37.2% 0.044 257.287);       /* slate-700 */
  --ifm-thin: oklch(40% 0.075 240);
  --ifm-thin-crack: oklch(90% 0.03 235 / 0.95);
  --ifm-water: oklch(19% 0.055 250);
  --ifm-water-deep: oklch(14% 0.04 252);
  --ifm-wave: oklch(74.6% 0.16 232.661 / 0.85);  /* sky-400 */
  --ifm-snow: oklch(92.9% 0.013 255.508);        /* slate-200 */
  --ifm-snow-edge: oklch(70.4% 0.04 256.788);    /* slate-400 */
  --ifm-snow-dot: oklch(82% 0.025 255);
  --ifm-goal-cell: oklch(27.9% 0.077 45.635);    /* amber-950 */
  --ifm-goal: oklch(82.8% 0.189 84.429);         /* amber-400 */
  --ifm-a: oklch(67.3% 0.182 276.935);           /* indigo-400 */
  --ifm-b: oklch(76.5% 0.177 163.223);           /* emerald-400 */
  --ifm-rim: oklch(98.4% 0.003 247.858);         /* slate-50 */
  --ifm-trail-a: oklch(78.5% 0.115 274.713 / 0.35); /* indigo-300/35 */
  --ifm-trail-b: oklch(84.5% 0.143 164.978 / 0.35); /* emerald-300/35 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ifm-wall: oklch(55.3% 0.013 58.071);
    --ifm-stone: oklch(55.3% 0.013 58.071);
    --ifm-stone-shadow: oklch(44.4% 0.011 73.639);
    --ifm-ice: oklch(27.9% 0.041 260.031);
    --ifm-joint: oklch(37.2% 0.044 257.287);
    --ifm-thin: oklch(40% 0.075 240);
    --ifm-thin-crack: oklch(90% 0.03 235 / 0.95);
    --ifm-water: oklch(19% 0.055 250);
    --ifm-water-deep: oklch(14% 0.04 252);
    --ifm-wave: oklch(74.6% 0.16 232.661 / 0.85);
    --ifm-snow: oklch(92.9% 0.013 255.508);
    --ifm-snow-edge: oklch(70.4% 0.04 256.788);
    --ifm-snow-dot: oklch(82% 0.025 255);
    --ifm-goal-cell: oklch(27.9% 0.077 45.635);
    --ifm-goal: oklch(82.8% 0.189 84.429);
    --ifm-a: oklch(67.3% 0.182 276.935);
    --ifm-b: oklch(76.5% 0.177 163.223);
    --ifm-rim: oklch(98.4% 0.003 247.858);
    --ifm-trail-a: oklch(78.5% 0.115 274.713 / 0.35);
    --ifm-trail-b: oklch(84.5% 0.143 164.978 / 0.35);
  }
}
.ifm-board { position: relative; }
.ifm-svg { position: absolute; overflow: visible; display: block; pointer-events: none; }
.ifm-wall { fill: var(--ifm-wall); stroke: var(--ifm-wall); stroke-width: 0.36; stroke-linejoin: round; }
.ifm-wall-fill { fill: var(--ifm-wall); }
.ifm-ice { fill: var(--ifm-ice); }
.ifm-joint { fill: none; stroke: var(--ifm-joint); stroke-width: 0.04; }
.ifm-goal-cell { fill: var(--ifm-goal-cell); }
.ifm-stone { fill: var(--ifm-stone); }
.ifm-stone-shadow { fill: var(--ifm-stone-shadow); }
.ifm-rock-crack { fill: none; stroke: var(--ifm-stone-shadow); stroke-width: 0.06; stroke-linecap: round; stroke-linejoin: round; }
.ifm-thin { fill: var(--ifm-thin); }
.ifm-thin-crack { fill: none; stroke: var(--ifm-thin-crack); stroke-width: 0.055; stroke-linecap: round; stroke-linejoin: round; }
.ifm-thin-crack-dark { fill: none; stroke: var(--ifm-water); stroke-width: 0.05; stroke-linecap: round; stroke-linejoin: round; }
.ifm-thin-glint { fill: none; stroke: var(--ifm-thin-crack); stroke-width: 0.07; stroke-linecap: round; opacity: 0.8; }
.ifm-water { fill: var(--ifm-water); }
.ifm-water-deep { fill: var(--ifm-water-deep); }
.ifm-wave { fill: none; stroke: var(--ifm-wave); stroke-width: 0.06; stroke-linecap: round; }
.ifm-ripple { fill: none; stroke: var(--ifm-wave); stroke-width: 0.06; }
.ifm-snow { fill: var(--ifm-snow); stroke: var(--ifm-snow-edge); stroke-width: 0.045; stroke-linejoin: round; }
.ifm-snow-flat { fill: var(--ifm-snow); }
.ifm-snow-shadow { fill: var(--ifm-snow-edge); }
.ifm-snow-dot { fill: var(--ifm-snow-dot); }
.ifm-wet { fill: var(--ifm-joint); }
.ifm-goal-ring { fill: none; stroke: var(--ifm-goal); stroke-width: 0.08; }
.ifm-goal-dot { fill: var(--ifm-goal); }
.ifm-trail { fill: var(--ifm-trail-a); }
.ifm-trail.is-b { fill: var(--ifm-trail-b); }
.ifm-piece-a { fill: var(--ifm-a); stroke: var(--ifm-rim); stroke-width: 0.08; }
.ifm-piece-b { fill: var(--ifm-b); stroke: var(--ifm-rim); stroke-width: 0.08; }
.ifm-sel { fill: none; stroke-width: 0.075; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.ifm-sel-a { stroke: var(--ifm-a); }
.ifm-sel-b { stroke: var(--ifm-b); }
.ifm-anim { transform-box: fill-box; transform-origin: center; }
/* 駒（div）。中の SVG は 1マス = 1単位、中心が原点。 */
.piece { position: absolute; left: 0; top: 0; pointer-events: none; transition-property: transform; transition-timing-function: linear; }
.piece > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
.piece .pc { transform-box: fill-box; transform-origin: center; }
.piece.selected .ifm-sel { opacity: 1; }
.piece[data-sel="lift"] .pc { transition: transform 150ms cubic-bezier(0.4, 0, 0.2, 1), opacity 150ms; }
.piece[data-sel="lift"].selected .pc { transform: scale(1.14); filter: drop-shadow(0 0.06px 0.04px rgb(0 0 0 / 0.45)); }
.piece[data-sel="lift"].dim .pc { opacity: 0.6; transform: scale(0.9); }
.piece.bump .pc { animation: ifm-bump 180ms ease-out; }
@keyframes ifm-bump { 40% { transform: scale(0.86); } }
@media (prefers-reduced-motion: reduce) { .piece { transition-duration: 0ms !important; } .piece.bump .pc { animation: none; } }
:root.reduce-motion .piece { transition-duration: 0ms !important; }
:root.reduce-motion .piece.bump .pc { animation: none; }

/* 器（盤面の外）はアプリの共通UIトークンに合わせて静かにする。盤面の色は上の --ifm-* */
:root {
  --bg: oklch(1 0 0); --surface: oklch(1 0 0); --ink: oklch(0.145 0 0); --ink-sub: oklch(0.556 0 0); --line: oklch(0.922 0 0);
  --goal: oklch(66.6% 0.179 58.318); --accent: oklch(0.205 0 0);
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.145 0 0); --surface: oklch(0.205 0 0); --ink: oklch(0.985 0 0); --ink-sub: oklch(0.708 0 0); --line: oklch(1 0 0 / 10%);
    --goal: oklch(82.8% 0.189 84.429); --accent: oklch(0.922 0 0); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.145 0 0); --surface: oklch(0.205 0 0); --ink: oklch(0.985 0 0); --ink-sub: oklch(0.708 0 0); --line: oklch(1 0 0 / 10%);
  --goal: oklch(82.8% 0.189 84.429); --accent: oklch(0.922 0 0); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
main { max-width: 560px; margin: 0 auto; padding: 10px 16px 40px; display: grid; gap: 10px; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
button:hover { border-color: var(--ink-sub); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav button { width: 40px; height: 36px; font-size: 1rem; }
.nav .no { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: center; }
.counts { font-size: 0.875rem; color: var(--ink-sub); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); }
.board-area { touch-action: none; user-select: none; -webkit-user-select: none; display: grid; justify-items: center; }
.board { position: relative; }
.msg { min-height: 1.5em; font-size: 0.9375rem; font-weight: 500; text-align: center; margin: 0; }
.msg.clear { color: var(--goal); font-weight: 700; }
.rule { font-size: 0.8125rem; color: var(--ink-sub); text-align: center; margin: 0; text-wrap: balance; }
.actions { display: flex; gap: 8px; justify-content: center; }
.actions button { padding: 8px 16px; font-size: 0.9375rem; }
.feel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.feel p { margin: 0; font-size: 0.875rem; }
.feel .scale { display: flex; gap: 6px; flex-wrap: wrap; }
.feel .scale button { width: 44px; height: 36px; font-variant-numeric: tabular-nums; }
.feel .scale button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.feel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.feel .row span { font-size: 0.75rem; color: var(--ink-sub); }
textarea { width: 100%; min-height: 5em; font: 0.75rem/1.5 ui-monospace, monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.peek { background: none; border: 0; color: var(--ink-sub); font-size: 0.75rem; text-decoration: underline; padding: 4px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="nav">
      <button type="button" id="prev" aria-label="前の問題">‹</button>
      <span class="no" id="no"></span>
      <button type="button" id="next" aria-label="次の問題">›</button>
    </div>
    <span class="counts">手数 <b id="moves">0</b> ・ <b id="time">0:00</b></span>
  </div>
  <div class="board-area" id="area"><div class="board" id="board" aria-label="盤面"></div></div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <p class="rule" id="rule"></p>
  <div class="actions">
    <button type="button" id="undo">待った</button>
    <button type="button" id="restart">盤面を戻す</button>
  </div>
  <section class="feel" aria-label="体感の記録">
    <p>この問題の体感の難しさ（1 とても易しい 〜 5 とても難しい）</p>
    <div class="scale" id="scale"></div>
    <div class="row">
      <span id="sync">記録はこのブラウザに保存しています。</span>
      <button type="button" class="peek" id="peek">ギブアップして答えを見る</button>
    </div>
    <textarea id="log" readonly aria-label="記録"></textarea>
  </section>
</main>
<script>
// ===== 氷の床迷路 盤面の描画と状態変化の動き =====
// 盤面の文字: "." 氷 / "#" 岩 / "b" もろい岩 / "c" 薄い氷 / "w" 水面（薄い氷が割れた後） / "s" 雪 / "x" 盤面の外
const IFM = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const T = 0.18; // 外壁の太さ（アプリの ICE_FLOOR_MAZE_WALL_THICKNESS と同じ）
  const n = (v) => Math.round(v * 1000) / 1000;
  const DEFAULT = { brittle: "split", thin: "cracked", water: "pool", snow: "patch", outside: "void", partner: "square", select: "brackets" };
  const EASE = {
    standard: "cubic-bezier(0.4, 0, 0.2, 1)",
    enter: "cubic-bezier(0, 0, 0.2, 1)",
    exit: "cubic-bezier(0.4, 0, 1, 1)",
    celebrate: "cubic-bezier(0.2, 0.8, 0.2, 1)",
  };
  /** 滑りの時間（アプリと同じ: 距離に比例、上限 400ms、等速）。 */
  const slideMs = (dist) => Math.min(400, 45 + 32 * dist);

  // 薄い氷のひび: 中心から3方向へ折れ曲がって伸びる（十字や×に見せない）。割れるときはこの線で3つの破片に分かれる。
  const C = [0.44, 0.54];
  const BR = [
    { k: [0.6, 0.3], e: [0.76, 0], t: 0.6 },
    { k: [0.7, 0.72], e: [1, 0.84], t: 0.35 },
    { k: [0.22, 0.44], e: [0, 0.3], t: 0.45 },
  ];
  // 破片: ひびの間の角（時計回り）。
  const BETWEEN = [[[1, 0]], [[1, 1], [0, 1]], [[0, 0]]];
  const shardPolys = BR.map((b, i) => {
    const nb = BR[(i + 1) % BR.length];
    return [C, b.k, b.e, ...BETWEEN[i], nb.e, nb.k];
  });
  const shardDirs = [[0.8, -0.4], [0, 1], [-0.6, -0.6]];

  const DEFS = `<defs>
<clipPath id="ifm-split-l" clipPathUnits="objectBoundingBox"><polygon points="0,0 .5,0 .4,.36 .56,.6 .38,1 0,1"/></clipPath>
<clipPath id="ifm-split-r" clipPathUnits="objectBoundingBox"><polygon points=".6,0 1,0 1,1 .48,1 .66,.6 .5,.36"/></clipPath>
${shardPolys.map((p, i) => `<clipPath id="ifm-shard-${i}" clipPathUnits="objectBoundingBox"><polygon points="${p.map((q) => q.join(",")).join(" ")}"/></clipPath>`).join("")}
</defs>`;

  // ---- 地形 ----
  const rock = (x, y) =>
    `<rect class="ifm-stone-shadow" x="${n(x + 0.06)}" y="${n(y + 0.14)}" width=".88" height=".8" rx=".18"/>` +
    `<rect class="ifm-stone" x="${n(x + 0.06)}" y="${n(y + 0.06)}" width=".88" height=".8" rx=".18"/>`;

  function brittle(x, y, v) {
    if (v === "rubble") {
      const stone = (sx, sy, w, h) =>
        `<rect class="ifm-stone-shadow" x="${n(x + sx)}" y="${n(y + sy + 0.07)}" width="${w}" height="${h}" rx=".12"/>` +
        `<rect class="ifm-stone" x="${n(x + sx)}" y="${n(y + sy)}" width="${w}" height="${h}" rx=".12"/>`;
      return stone(0.3, 0.06, 0.44, 0.36) + stone(0.06, 0.46, 0.46, 0.42) + stone(0.54, 0.5, 0.4, 0.38);
    }
    if (v === "lines") {
      return rock(x, y) + `<path class="ifm-rock-crack" d="M${n(x + 0.56)} ${n(y + 0.08)}L${n(x + 0.44)} ${n(y + 0.36)}L${n(x + 0.6)} ${n(y + 0.56)}L${n(x + 0.42)} ${n(y + 0.84)}M${n(x + 0.6)} ${n(y + 0.56)}L${n(x + 0.84)} ${n(y + 0.5)}"/>`;
    }
    // split: 岩が割れ目で2つに分かれ、隙間から氷が見える
    return `<g class="ifm-anim" data-chunk="l" clip-path="url(#ifm-split-l)">${rock(x, y)}</g><g class="ifm-anim" data-chunk="r" clip-path="url(#ifm-split-r)">${rock(x, y)}</g>`;
  }

  const crackPath = (x, y) =>
    BR.map((b) => {
      const end = [b.k[0] + b.t * (b.e[0] - b.k[0]), b.k[1] + b.t * (b.e[1] - b.k[1])];
      return `M${n(x + C[0])} ${n(y + C[1])}L${n(x + b.k[0])} ${n(y + b.k[1])}L${n(x + end[0])} ${n(y + end[1])}`;
    }).join("");

  function thin(x, y, v) {
    const pane = `<rect class="ifm-thin" x="${n(x + 0.02)}" y="${n(y + 0.02)}" width=".96" height=".96" rx=".06"/>`;
    if (v === "darkcrack") {
      return `<path class="ifm-thin-crack-dark" d="M${n(x + 0.18)} ${n(y + 0.22)}L${n(x + 0.42)} ${n(y + 0.46)}L${n(x + 0.38)} ${n(y + 0.6)}L${n(x + 0.8)} ${n(y + 0.82)}M${n(x + 0.42)} ${n(y + 0.46)}L${n(x + 0.72)} ${n(y + 0.3)}"/>`;
    }
    if (v === "frost") {
      return pane + `<path class="ifm-thin-glint" d="M${n(x + 0.24)} ${n(y + 0.58)}L${n(x + 0.58)} ${n(y + 0.24)}M${n(x + 0.42)} ${n(y + 0.76)}L${n(x + 0.76)} ${n(y + 0.42)}"/>`;
    }
    return pane + `<path class="ifm-thin-crack" d="${crackPath(x, y)}"/>`;
  }

  const wave = (x, y) => `M${n(x)} ${n(y)}q.075 -.08 .15 0t.15 0`;
  function water(x, y, v) {
    const base = `<rect class="ifm-water" x="${n(x + 0.02)}" y="${n(y + 0.02)}" width=".96" height=".96" rx=".06"/>`;
    if (v === "flat") return base;
    // pool: 一段沈んだ水面。上の縁に影（岩は下に影＝盛り上がり、水面は上に影＝くぼみ）と、小さな波。
    return base +
      `<path class="ifm-water-deep" d="M${n(x + 0.02)} ${n(y + 0.16)}V${n(y + 0.08)}q0 -.06 .06 -.06H${n(x + 0.92)}q.06 0 .06 .06V${n(y + 0.16)}Z"/>` +
      `<path class="ifm-wave" d="${wave(x + 0.2, y + 0.5)}${wave(x + 0.5, y + 0.74)}"/>`;
  }

  function scallop(x, y, a = 0.08, b = 0.92, r = 0.2, per = 3) {
    const step = (b - a) / per;
    const A = (px, py) => `A${r} ${r} 0 0 1 ${n(x + px)} ${n(y + py)}`;
    let d = `M${n(x + a)} ${n(y + a)}`;
    for (let i = 1; i <= per; i++) d += A(a + step * i, a);
    for (let i = 1; i <= per; i++) d += A(b, a + step * i);
    for (let i = 1; i <= per; i++) d += A(b - step * i, b);
    for (let i = 1; i <= per; i++) d += A(a, b - step * i);
    return d + "Z";
  }
  function snow(x, y, v) {
    if (v === "mound") {
      const d = (dy) => `M${n(x + 0.1)} ${n(y + 0.84 + dy)}C${n(x + 0.08)} ${n(y + 0.52 + dy)} ${n(x + 0.3)} ${n(y + 0.36 + dy)} ${n(x + 0.44)} ${n(y + 0.44 + dy)}C${n(x + 0.52)} ${n(y + 0.22 + dy)} ${n(x + 0.84)} ${n(y + 0.24 + dy)} ${n(x + 0.86)} ${n(y + 0.52 + dy)}C${n(x + 0.95)} ${n(y + 0.6 + dy)} ${n(x + 0.94)} ${n(y + 0.8 + dy)} ${n(x + 0.9)} ${n(y + 0.84 + dy)}Z`;
      return `<path class="ifm-snow-shadow" d="${d(0.08)}"/><path class="ifm-snow-flat" d="${d(0)}"/>`;
    }
    if (v === "powder") {
      let dots = "";
      for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) dots += `<circle class="ifm-snow" cx="${n(x + 0.2 + i * 0.3)}" cy="${n(y + 0.2 + j * 0.3)}" r=".1"/>`;
      return dots;
    }

    return `<path class="ifm-snow" d="${scallop(x, y)}"/>` +
      `<circle class="ifm-snow-dot" cx="${n(x + 0.3)}" cy="${n(y + 0.32)}" r=".045"/><circle class="ifm-snow-dot" cx="${n(x + 0.68)}" cy="${n(y + 0.62)}" r=".045"/>`;
  }

  /** マスに載る要素。氷・盤面の外は地形側で描くので空。 */
  function cell(ch, x, y, opt = {}) {
    const v = { ...DEFAULT, ...opt };
    switch (ch) {
      case "#": return rock(x, y);
      case "b": return brittle(x, y, v.brittle);
      case "c": return thin(x, y, v.thin);
      case "w": return water(x, y, v.water);
      case "s": return snow(x, y, v.snow);

  function terrain(rows, goal, opt = {}) {

    const H = rows.length, W = rows[0].length;
    const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H && rows[y][x] !== "x";
    const framed = (x, y) => v.outside === "stone" ? x >= 0 && y >= 0 && x < W && y < H : inside(x, y);
    let wall = "", ice = "", joint = "";
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

      if (!inside(x, y)) continue;

  }

  const goalMark = (g) =>
    `<g data-goal><circle class="ifm-goal-ring" cx="${g[0] + 0.5}" cy="${g[1] + 0.5}" r=".4"/><circle class="ifm-goal-dot" cx="${g[0] + 0.5}" cy="${g[1] + 0.5}" r=".11"/>` +
    `<circle class="ifm-goal-ring ifm-anim" data-burst cx="${g[0] + 0.5}" cy="${g[1] + 0.5}" r=".4" opacity="0"/></g>`;

  /** 直前の滑りの跡（アプリと同じ: 幅 .42 の丸い帯）。 */
  function trailGeom(from, to) {
    const w = 0.42;
    return {
      x: Math.min(from[0], to[0]) + 0.5 - w / 2,
      y: Math.min(from[1], to[1]) + 0.5 - w / 2,
      width: Math.abs(to[0] - from[0]) + w,
      height: Math.abs(to[1] - from[1]) + w,

      origin: to[0] > from[0] ? "left center" : to[0] < from[0] ? "right center" : to[1] > from[1] ? "center top" : "center bottom",

  }

  /** 駒の中身（1マス = 1単位、中心が原点）。主駒 "a" は丸、相棒 "b" は角の丸い四角。 */
  function piece(who, opt = {}) {
    const v = { ...DEFAULT, ...opt };

      ? `<circle class="ifm-piece-${who}" r=".32"/>`

      sel = who === "a" || v.partner === "circle"
        ? `<circle class="ifm-sel ifm-sel-${who} ifm-anim" r=".45" stroke-width=".06"/>`

  }

    const el = document.createElementNS(NS, tag);

    return el;
  }

  // ---- 状態変化の動き（Web Animations）。動きを減らす設定では呼ばない。 ----
  function overlay(fx, html) {
    const g = svgEl("g");
    g.innerHTML = html;

  /** もろい岩が崩れる: 割れ目から2つに分かれて、ぶつかった向きへ傾きながら沈んで消える。 */
  function crumble(fx, x, y, delay, dir = [0, 0], opt = {}) {
    const v = { ...DEFAULT, ...opt };
    const g = overlay(fx, brittle(x, y, "split"));
    const [dx, dy] = dir;
    const anims = [...g.querySelectorAll("[data-chunk]")].map((chunk) => {
      const s = chunk.dataset.chunk === "l" ? -1 : 1;
      return chunk.animate([
        { transform: "translate(0px, 0px) rotate(0deg) scale(1)", opacity: 1 },
        { transform: `translate(${n(s * 0.05)}px, 0px) rotate(${s * 4}deg) scale(1)`, opacity: 1, offset: 0.3 },
        { transform: `translate(${n(s * 0.12 + dx * 0.12)}px, ${n(0.1 + dy * 0.12)}px) rotate(${s * 16}deg) scale(0.5)`, opacity: 0 },
      ], { duration: 300, delay, easing: EASE.exit, fill: "both" });
    });

      // 見本の別案でも、崩れる動き自体は同じにする
    }
    cleanup(g, anims);
  }

  /** 薄い氷が割れる: ひびの線で4つに割れて沈み、水面に波紋が広がる。 */
  function shatter(fx, x, y, delay) {
    const pane = thin(x, y, "cracked");
    const ripple = `<circle class="ifm-ripple ifm-anim" cx="${x + 0.5}" cy="${y + 0.5}" r=".16" opacity="0"/>`;
    const g = overlay(fx, ripple + shardPolys.map((_, i) => `<g class="ifm-anim" data-shard="${i}" clip-path="url(#ifm-shard-${i})">${pane}</g>`).join(""));
    const anims = [...g.querySelectorAll("[data-shard]")].map((s) => {
      const [ox, oy] = shardDirs[+s.dataset.shard];
      return s.animate([
        { transform: "translate(0px, 0px) scale(1)", opacity: 1 },
        { transform: `translate(${n(ox * 0.03)}px, ${n(oy * 0.03)}px) scale(0.96)`, opacity: 1, offset: 0.25 },
        { transform: `translate(${n(ox * 0.06)}px, ${n(oy * 0.06)}px) scale(0.55)`, opacity: 0 },

      { transform: "scale(1)", opacity: 0.9 },
      { transform: "scale(2.6)", opacity: 0 },

  }

  /** 雪が溶ける: 雪がしぼんで消え、濡れた跡が一瞬残って氷に戻る。 */
  function melt(fx, x, y, delay, opt = {}) {

        { transform: "scale(1, 1)", opacity: 1 },
        { transform: "scale(0.7, 0.55)", opacity: 0 },

        { opacity: 0 }, { opacity: 0.9, offset: 0.35 }, { opacity: 0 },

  }

  /** 盤面のマスが変わったときの動き。古い姿を上に重ねて消す（下には新しい姿が描いてある）。 */
  function animateChange(fx, from, x, y, delay, dir, opt) {

      { transform: "scale(1.3)", opacity: 0 },
      { transform: "scale(1)", opacity: 1 },

  }

  /** クリア: アプリと同じくゴールの輪が広がり、駒が一度ふくらむ。 */
  function celebrate(svg, pieceEl, delay) {
    svg.querySelector("[data-burst]")?.animate([
      { transform: "scale(1)", opacity: 0.9 },
      { transform: "scale(2.2)", opacity: 0 },
    ], { duration: 560, delay, easing: EASE.celebrate });
    pieceEl?.querySelector(".pc")?.animate([
      { transform: "scale(1)" }, { transform: "scale(1.18)", offset: 0.4 }, { transform: "scale(1)" },
    ], { duration: 360, delay, easing: EASE.celebrate });
  }

  /** 跡を滑りと同じ速さで伸ばす。 */
  function growTrail(rect, geom, duration) {
    rect.style.transformBox = "fill-box";
    rect.style.transformOrigin = geom.origin;
    rect.animate([{ transform: `${geom.axis}(0)` }, { transform: `${geom.axis}(1)` }], { duration, easing: "linear" });

  return { NS, T, DEFAULT, EASE, DEFS, slideMs, cell, terrain, goalMark, trailGeom, piece, svgEl, animateChange, selectPop, celebrate, growTrail };
})();

<script>
(() => {
  const PROBLEMS = /*__PROBLEMS__*/[];
  const STORE_KEY = "/*__STORE_KEY__*/";
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const RULES = {
    duo: "駒は2つ。駒をタップして選び（選んだ駒は四隅のかぎで囲まれる）、スワイプで滑らせる。駒どうしもぶつかって止まる。丸い駒をゴールで止めればクリア。四角い駒は止め役に使う相棒。",
    brittle: "割れ目の入った岩は、ぶつかって止まると崩れて氷になる。止め役に使えるのは一度だけ。",
    cracked: "ひびの入った薄い氷は滑れるが、駒が通ったり止まったりして離れると割れて水面になる。駒は水に入れず、水面の手前で止まる。",
    thin: "ひびの入った薄い氷は滑れるが、駒が通ったり止まったりして離れると割れて水面になる。駒は水に入れず、水面の手前で止まる。",
    mixed: "割れ目の入った岩は、ぶつかって止まると崩れて氷になる。ひびの入った薄い氷は、駒が離れると割れて水面になり、水面の手前で止まる。",
    snow: "雪のマスに滑り込むと、そこで止まる。駒が離れると雪は溶けて氷になり、次からは滑って通り抜ける。",
  };

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const board = $("board"), area = $("area"), msg = $("msg");

  // ---- 記録 ----
  let store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { store = {}; }
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {} };
  let db = null;
  const writing = {}, dirty = {};
  function push(id) {
    if (!db || !store[id]) return;
    if (writing[id]) { dirty[id] = true; return; }
    const { pendingUndos, ...data } = store[id];
    writing[id] = db.doc(`results/${id}`).set({ ...data, id, updatedAt: Date.now() })
      .then(() => { $("sync").textContent = "記録は自動で保存されています。"; })
      .catch(() => { $("sync").textContent = "記録を保存できませんでした。このブラウザには残っています。"; })

    try {
      const use = window.claude && window.claude.use;
      if (!use) return;
      db = await use("db");

      Object.keys(store).forEach(push);
    } catch { db = null; }
  })();
  const rec = (i) => (store[PROBLEMS[i].id] ||= {});

  // ---- 規則 ----
  // state: { cells: string[] (y*W+x), a: [x,y], b: [x,y]|null }
  let P, W, H;
  const at = (s, x, y) => s.cells[y * W + x];
  const solid = (c) => c === "#" || c === "b" || c === "x" || c === "w";
  const same = (p, q) => p && q && p[0] === q[0] && p[1] === q[1];
  function slideState(s, who, dir) {
    const [dx, dy] = DIRS[dir];
    const me = who === "a" ? s.a : s.b, other = who === "a" ? s.b : s.a;
    let [x, y] = me; const path = [[x, y]];
    let stopReason = "wall";

      const nx = x + dx, ny = y + dy;

      const c = at(s, nx, ny);
      if (solid(c)) { stopReason = c === "b" ? "brittle" : "wall"; break; }
      if (other && other[0] === nx && other[1] === ny) { stopReason = "piece"; break; }
      x = nx; y = ny; path.push([x, y]);

    const out = [];

    const prev = new Map([[keyOf(from), null]]); const q = [from];
    for (let h = 0; h < q.length && prev.size < cap; h++) {
      const s = q[h];
      if (won(s)) { const steps = []; let k = keyOf(s); while (prev.get(k)) { const [pk, who, d] = prev.get(k); steps.unshift([who, d]); k = pk; } return steps; }
      for (const [who, d, n] of successors(s)) { const k = keyOf(n); if (!prev.has(k)) { prev.set(k, [keyOf(s), who, d]); q.push(n); } }
    }
    return null;
  }
  function trapped(s) {
    // ゴールへ行けず、行ける状態がすべて今の状態へ戻れる（閉じた輪の中を回るだけ）のとき
    const seen = new Map([[keyOf(s), s]]); const q = [s];
    for (let h = 0; h < q.length; h++) {
      if (q.length > 400) return false;
      const cur = q[h]; if (won(cur)) return false;
      for (const [, , n] of successors(cur)) { const k = keyOf(n); if (!seen.has(k)) { seen.set(k, n); q.push(n); } }
    }
    const home = keyOf(s);
    for (const t of q) {
      const vis = new Set([keyOf(t)]); const qq = [t]; let back = false;
      for (let h = 0; h < qq.length && !back; h++) for (const [, , n] of successors(qq[h])) { const k = keyOf(n); if (k === home) { back = true; break; } if (!vis.has(k)) { vis.add(k); qq.push(n); } }
      if (!back && keyOf(t) !== home) return false;
    }
    return true;
  }

  // ---- 表示 ----
  let state, history, moves, cleared, startTime, timer, cur = 0, cellPx = 30, playing = null, selected = "a", cellEls = [], drawn = [], pieceEls = {}, trailEl, svgEl, fxEl, lastTrail = null;
  function fitCell() {
    const T = IFM.T;
    const maxW = Math.min(area.clientWidth, 540) - 8;
    const maxH = window.innerHeight - 230;
    cellPx = Math.max(16, Math.floor(Math.min(maxW / (W + 2 * T), maxH / (H + 2 * T), 48)));
    Object.assign(board.style, { width: W * cellPx + "px", height: H * cellPx + "px", margin: T * cellPx + "px" });
    Object.assign(svgEl.style, { left: -T * cellPx + "px", top: -T * cellPx + "px", width: (W + 2 * T) * cellPx + "px", height: (H + 2 * T) * cellPx + "px" });
    for (const el of Object.values(pieceEls)) el.style.width = el.style.height = cellPx + "px";
    if (state) { placeAll(0); redrawTrail(); }
  }
  // path: 直前の滑りで通ったマス（始点から終点）。渡されたときだけ、変わったマスを駒の動きに合わせて動かす。
  function renderCells(path) {
    const dist = path ? path.length - 1 : 0, D = IFM.slideMs(dist);
    const dir = path ? [Math.sign(path[1][0] - path[0][0]), Math.sign(path[1][1] - path[0][1])] : [0, 0];
    if (!path) fxEl.innerHTML = "";
    for (let i = 0; i < W * H; i++) {
      const c = state.cells[i], prev = drawn[i];
      if (prev === c) continue;
      const x = i % W, y = (i / W) | 0;
      cellEls[i].innerHTML = IFM.cell(c, x, y);
      drawn[i] = c;
      if (!path || reduced || prev == null) continue;
      // 薄い氷・雪は駒がそのマスを離れる時刻に、もろい岩は駒が止まった時刻に変える。
      const k = path.findIndex(([px, py]) => px === x && py === y);
      IFM.animateChange(fxEl, prev, x, y, prev === "b" ? D : k >= 0 ? D * (k + 0.5) / dist : 0, dir);
    }
  }
  function placeAll(dist, who) {
    for (const k of Object.keys(pieceEls)) {
      const p = state[k], el = pieceEls[k];
      el.style.transitionDuration = reduced || k !== who ? "0ms" : IFM.slideMs(dist) + "ms";
      el.style.transform = `translate(${p[0] * cellPx}px, ${p[1] * cellPx}px)`;
      const was = el.classList.contains("selected"), now = P.variant === "duo" && k === selected;
      el.classList.toggle("selected", now);

      trailEl.setAttribute("class", "ifm-trail" + (who === "b" ? " is-b" : ""));
      if (!reduced) IFM.growTrail(trailEl, IFM.trailGeom(lastTrail[0], lastTrail[1]), IFM.slideMs(dist));
    }
  }
  function drawTrail(from, to) { lastTrail = from ? [from, to] : null; redrawTrail(); }
  function redrawTrail() {
    if (!lastTrail) { trailEl.style.display = "none"; return; }
    const g = IFM.trailGeom(lastTrail[0], lastTrail[1]);
    for (const k of ["x", "y", "width", "height", "rx"]) trailEl.setAttribute(k, g[k]);
    trailEl.style.display = "";
  }
  const fmt = (ms) => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  function tick() { if (!cleared) $("time").textContent = fmt(Date.now() - startTime); }
  const initialState = () => ({ cells: P.rows.join("").split(""), a: P.start.slice(), b: P.partner ? P.partner.slice() : null });

  function load(i) {
    stopPlaying();
    cur = i; P = PROBLEMS[i]; W = P.width; H = P.height;
    board.innerHTML = ""; cellEls = []; drawn = []; pieceEls = {}; state = null;
    const T = IFM.T;
    svgEl = IFM.svgEl("svg", { class: "ifm-svg", viewBox: `${-T} ${-T} ${W + 2 * T} ${H + 2 * T}`, "aria-hidden": "true" });
    svgEl.innerHTML = IFM.DEFS + `<g>${IFM.terrain(P.rows, P.goal)}</g><g data-cells></g><g data-fx></g><rect class="ifm-trail" style="display:none"/>` + IFM.goalMark(P.goal);
    board.appendChild(svgEl);
    const cellLayer = svgEl.querySelector("[data-cells]"); fxEl = svgEl.querySelector("[data-fx]"); trailEl = svgEl.querySelector(".ifm-trail");
    for (let k = 0; k < W * H; k++) { const g = IFM.svgEl("g"); cellLayer.appendChild(g); cellEls.push(g); drawn.push(null); }
    for (const who of movers()) { const el = document.createElement("div"); el.className = "piece" + (who === "b" ? " partner" : ""); el.innerHTML = IFM.piece(who); board.appendChild(el); pieceEls[who] = el; }
    $("no").textContent = `問題 ${i + 1} / ${PROBLEMS.length}`;
    $("prev").disabled = i === 0; $("next").disabled = i === PROBLEMS.length - 1;
    $("rule").textContent = RULES[P.variant] || "";
    fitCell(); start(); renderFeel();
  }
  let attemptLog = [];
  const logStep = (step) => attemptLog.push([step, Date.now() - startTime]);
  function start() {
    attemptLog = []; selected = "a";
    state = initialState(); history = []; moves = 0; cleared = false;
    startTime = Date.now(); clearInterval(timer); timer = setInterval(tick, 250); tick();
    renderCells(); drawTrail(null); placeAll(0); $("moves").textContent = "0";
    const r = store[P.id];
    msg.className = "msg";
    msg.textContent = r?.cleared ? `クリア済み（${r.moves} 手 ・ ${fmt(r.ms)}）。もう一度遊べます。` : "";
  }
  function showStatus() {
    if (cleared || playing) return;
    msg.className = "msg";
    msg.textContent = trapped(state) ? "閉じ込められた（待った・盤面を戻すで戻れます）" : "";
  }
  function move(dir, who = selected) {
    if (cleared) return;
    const r = slideState(state, who, dir);
    if (!r) { const el = pieceEls[who]; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); return; }
    history.push(state); state = r.state; moves++;
    if (!playing) logStep((P.variant === "duo" ? who.toUpperCase() : "") + dir[0]);
    drawTrail(r.path[0], r.path[r.path.length - 1]); renderCells(r.path); placeAll(r.path.length - 1, who); $("moves").textContent = moves;
    if (won(state)) {
      cleared = true; clearInterval(timer);
      if (!reduced) IFM.celebrate(svgEl, pieceEls.a, IFM.slideMs(r.path.length - 1));
      const ms = Date.now() - startTime, rr = rec(cur);
      msg.className = "msg clear";
      msg.textContent = `クリア！ ${moves} 手 ・ ${fmt(ms)}（最短 ${P.optimal} 手）`;
      if (!rr.cleared && !playing) Object.assign(rr, { cleared: true, moves, ms, undos: rr.pendingUndos || 0, log: attemptLog.map(([a, t]) => `${a}${t}`).join(" ") });
      delete rr.pendingUndos; persist(P.id); renderLog();
    } else showStatus();
  }
  function undo() {
    if (!history.length || cleared || playing) return;
    state = history.pop(); drawTrail(null); renderCells(); placeAll(1);
    const r = rec(cur); r.pendingUndos = (r.pendingUndos || 0) + 1; save(); logStep("z"); showStatus();
  }
  function restart() {
    if (cleared || playing || !history.length) return;
    state = initialState(); history = []; drawTrail(null); renderCells(); placeAll(0); msg.textContent = ""; logStep("R");
  }
  function stopPlaying() { if (playing) { clearInterval(playing); playing = null; } }
  function peek() {
    stopPlaying();
    const r = rec(cur);
    if (!r.cleared && !r.gaveUp) Object.assign(r, { gaveUp: true, gaveUpAfterMs: Date.now() - startTime, gaveUpMoves: moves, log: attemptLog.map(([a, t]) => `${a}${t}`).join(" ") });
    persist(P.id); renderLog();
    start();
    const steps = solve(state); let i = 0;
    msg.className = "msg"; msg.textContent = `答えを再生中（最短 ${P.optimal} 手）`;
    playing = setInterval(() => {
      if (!steps || i >= steps.length) { stopPlaying(); return; }
      const [who, d] = steps[i++]; selected = who; move(d, who);
    }, reduced ? 350 : 500);
  }

  const scale = $("scale");
  for (let v = 1; v <= 5; v++) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = v; b.dataset.v = v;
    b.addEventListener("click", () => { rec(cur).feel = v; persist(P.id); renderFeel(); renderLog(); });
    scale.appendChild(b);
  }
  function renderFeel() { const f = store[P.id]?.feel; scale.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.v === f))); }
  function renderLog() {
    const lines = PROBLEMS.map((p, i) => {
      const r = store[p.id];
      if (!r || (!r.cleared && !r.gaveUp && !r.feel)) return null;
      const result = r.cleared ? `クリア ${r.moves}手(最短${p.optimal}) ${fmt(r.ms)} 待った${r.undos || 0}` : r.gaveUp ? `ギブアップ(最短${p.optimal})` : "未クリア";
      return `問題${i + 1} ${result}${r.feel ? ` 体感${r.feel}` : ""}`;
    }).filter(Boolean);
    $("log").value = lines.length ? lines.join("\n") : "遊んだ問題の記録がここに出ます。";
  }
  $("peek").addEventListener("click", peek);
  $("undo").addEventListener("click", undo);
  $("restart").addEventListener("click", restart);
  $("prev").addEventListener("click", () => cur > 0 && load(cur - 1));
  $("next").addEventListener("click", () => cur < PROBLEMS.length - 1 && load(cur + 1));

  // ---- 入力 ----
  const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
  function select(who) { if (P.variant !== "duo" || playing) return; selected = who; placeAll(0); }
  addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLButtonElement && (e.key === "Enter" || e.key === " ")) return;
    if (P.variant === "duo" && (e.key === " " || e.key === "Tab")) { e.preventDefault(); select(selected === "a" ? "b" : "a"); return; }
    const d = KEYS[e.key];
    if (d && !e.repeat && !e.metaKey && !e.ctrlKey && !e.altKey && !playing) { e.preventDefault(); move(d); }
  });
  function pieceAt(e) {
    const r = board.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / cellPx), y = Math.floor((e.clientY - r.top) / cellPx);
    return movers().find((k) => state[k][0] === x && state[k][1] === y) || null;
  }
  let touch = null, fired = false;
  area.addEventListener("pointerdown", (e) => {
    touch = [e.clientX, e.clientY]; fired = false;
    const who = pieceAt(e); if (who) select(who);
  });
  area.addEventListener("pointermove", (e) => {
    if (!touch || fired || playing) return;
    const dx = e.clientX - touch[0], dy = e.clientY - touch[1];
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    fired = true;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  addEventListener("pointerup", () => { touch = null; });
  addEventListener("resize", fitCell);

  load(0); renderLog();
})();
</script>
</body>
</html>
