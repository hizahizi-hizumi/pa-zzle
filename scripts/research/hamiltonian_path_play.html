<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハミルトン路（仕切りあり）試作</title>
<style>
  :root { --bg:#f7f5f0; --fg:#22201c; --muted:#6c675d; --cell:#fbfaf6; --grid:#d6d0c2; --wall:#3b3833;

  .status strong { color:var(--fg); font-size:18px; }
  #board-wrap { position:relative; width:100%; }
  #board { display:block; width:100%; height:auto; touch-action:none; user-select:none; -webkit-user-select:none;
           -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #clear { position:absolute; left:0; right:0; bottom:8px; display:none; justify-content:center; pointer-events:none; }
  #clear span { background:var(--ok); color:#fff; font-weight:700; font-size:16px; padding:8px 18px; border-radius:999px; box-shadow:0 4px 16px rgba(0,0,0,.2); }
  #clear.show { display:flex; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .record { margin-top:8px; font-size:13px; color:var(--muted); min-height:18px; }
  details { margin-top:16px; font-size:13px; color:var(--muted); }
  details .row { margin-top:8px; }
  label.check { display:flex; align-items:center; gap:6px; min-height:44px; }
  .rules { margin-top:16px; color:var(--muted); font-size:13px; line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>全マス一筆書き（仕切りあり・一意解）</h1>
  <div class="row"><select id="puzzle" aria-label="問題"></select></div>
  <div class="row"><label class="check"><input type="checkbox" id="hide-band" checked> 帯は解き終わるまで隠す</label></div>
  <div class="status"><span id="label"></span><span>残り <strong id="remain">0</strong> マス</span></div>
  <div id="board-wrap">
    <svg id="board" role="application" aria-label="盤面"></svg>
    <div id="clear"><span>クリア</span></div>
  </div>
  <div class="actions">
    <button id="undo" type="button">元に戻す</button>
    <button id="reset" type="button">最初から</button>
  </div>
  <div class="record" id="record"></div>
  <p class="rules">橙の丸から始め、黒いマスと黒い仕切りの棒を越えずに、上下左右に隣り合うマスをたどって残りの全マスを1回ずつ通る。道の先端から指でなぞるか、先端の隣のマスをタップして延ばす。道の途中のマスを押すとそこまで戻る。答えは1通り。</p>
  <details>
    <summary>試験用の設定</summary>
    <div class="row">
      <label>仕切りの表示:
        <select id="thin-style">
          <option value="bar">短い棒（角を空ける）</option>
          <option value="bold">太い黒線</option>
          <option value="thin">細い黒線</option>
          <option value="accent">太い色線</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>マス飛ばし:
        <select id="mode">
          <option value="interp">補間する</option>
          <option value="ignore">無視する</option>
        </select>
      </label>
    </div>
    <div class="row"><button id="show-answer" type="button">答えを薄く表示</button></div>
  </details>
</main>

function setPath(p) {

// 先端に通じる角マス。仕切りで塞がれた角は通らない。
function cornerVia(h, c, dir) {
  const [hr, hc] = rc(h), [cr, cc] = rc(c);
  const viaRow = hr * S.pz.w + cc;
  const viaCol = cr * S.pz.w + hc;
  const order = Math.abs(dir.dx) >= Math.abs(dir.dy) ? [viaRow, viaCol] : [viaCol, viaRow];
  return order.find((v) => free(v) && passable(h, v) && passable(v, c));
}

  }
  const h = head();
  if (adjacent(h, c)) {
    if (passable(h, c)) { push(c); return true; }
    S.stats.blockedByThin++;
    return false;
  }
  if (S.mode === "ignore" || !fromHead) { S.stats.ignoredNonAdjacent++; return false; }
  const [hr, hc] = rc(h), [cr, cc] = rc(c);
  if (Math.abs(hr - cr) === 1 && Math.abs(hc - cc) === 1) {
    const v = cornerVia(h, c, dir);
    if (v != null) { push(v); push(c); S.stats.cornerFill++; return true; }
    S.stats.blockedByThin++;
    return false;
  }
  let changed = false;
  for (let guard = 0; guard < 64; guard++) {
    const cur = head();
    if (adjacent(cur, c)) { if (free(c) && passable(cur, c)) { push(c); changed = true; } break; }
    const [r0, c0] = rc(cur);
    const opts = [];
    if (cr > r0) opts.push(cur + S.pz.w); if (cr < r0) opts.push(cur - S.pz.w);
    if (cc > c0) opts.push(cur + 1); if (cc < c0) opts.push(cur - 1);
    const next = opts.find((o) => free(o) && passable(cur, o));
    if (next == null) break;
    push(next); S.stats.stepFill++; changed = true;
  }
  if (!changed) S.stats.ignoredNonAdjacent++;
  return changed;
}

function boardMetrics() {
  const r = board.getBoundingClientRect();
  const pad = 0.12;
  const size = r.width / (S.pz.w + pad);
  return { left: r.left + (pad / 2) * size, top: r.top + (pad / 2) * size, size };
}

function cellAt(x, y, ref, m) {
  const fx = (x - m.left) / m.size, fy = (y - m.top) / m.size;
  const col = Math.floor(fx), row = Math.floor(fy);
  if (col < 0 || row < 0 || col >= S.pz.w || row >= S.pz.h) return ref;
  const c = row * S.pz.w + col;
  if (ref != null && c !== ref && S.hysteresis > 0) {
    const ix = fx - col, iy = fy - row, k = S.hysteresis;
    if (ix < k || ix > 1 - k || iy < k || iy > 1 - k) return ref;
  }
  return c;
}

let snapshotBeforeDrag = null;

board.addEventListener("pointerdown", (e) => {
  if (S.cleared || !e.isPrimary) return;
  e.preventDefault();
  const m = boardMetrics();
  const c = cellAt(e.clientX, e.clientY, null, m);
  if (c == null || S.wall[c]) { S.stats.ignoredInvalid++; return; }
  snapshotBeforeDrag = S.path.slice();
  let ok = false;
  if (S.pos[c] >= 0) {
    if (S.pos[c] < S.path.length - 1) truncateTo(S.pos[c]);
    ok = true;
  } else if (passable(head(), c)) {
    push(c); ok = true;
  } else if (adjacent(head(), c)) {
    S.stats.blockedByThin++;
  } else {
    S.stats.ignoredInvalid++;
  }
  if (ok) {
    S.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, ref: c };
    try { board.setPointerCapture(e.pointerId); } catch (_) {}
  }
  render();
});

board.addEventListener("pointermove", (e) => {
  const d = S.drag;
  if (!d || e.pointerId !== d.id) return;
  e.preventDefault();
  const m = boardMetrics();
  const pts = [];
  if (S.mode === "interp") {
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (m.size / 6)));
    for (let k = 1; k <= steps; k++) pts.push([d.x + (dx * k) / steps, d.y + (dy * k) / steps]);
  } else {
    pts.push([e.clientX, e.clientY]);
  }
  let changed = false;
  for (const [x, y] of pts) {
    const c = cellAt(x, y, d.ref, m);
    if (c !== d.ref) {
      changed = enter(c, { dx: x - d.x, dy: y - d.y }, d.ref === head()) || changed;
      d.ref = c;
    }
    if (S.path.length === total()) break;
  }
  d.x = e.clientX; d.y = e.clientY;
  if (changed) { render(); checkClear(); }
});

function endDrag(e) {
  const d = S.drag;
  if (!d || e.pointerId !== d.id) return;
  S.drag = null;
  commit();
}
board.addEventListener("pointerup", endDrag);
board.addEventListener("pointercancel", endDrag);
board.addEventListener("contextmenu", (e) => e.preventDefault());

function commit() {
  if (snapshotBeforeDrag && snapshotBeforeDrag.join() !== S.path.join()) S.history.push(snapshotBeforeDrag);
  snapshotBeforeDrag = null;
  render();
  checkClear();
}

function validPath(p) {
  if (p[0] !== S.pz.start || p.length !== total()) return false;
  const seen = new Set();
  for (let k = 0; k < p.length; k++) {
    if (S.wall[p[k]] || seen.has(p[k])) return false;
    seen.add(p[k]);
    if (k > 0 && !passable(p[k - 1], p[k])) return false;
  }
  return true;
}

function checkClear() {
  if (!S.cleared && validPath(S.path)) {
    S.cleared = true; S.drag = null; S.clearedAt = performance.now();
    if (snapshotBeforeDrag) { S.history.push(snapshotBeforeDrag); snapshotBeforeDrag = null; }
    render();
  }
}

// タッチ・ペンは pointerup で受け、click はマウス・キーボードだけで受ける。
// （盤面で指を動かしたまま離した直後のタップは、Chromium で click が次のタッチまで遅れることがあるため）
let lastPointerType = "mouse";
document.addEventListener("pointerdown", (e) => { lastPointerType = e.pointerType; }, true);
function bindButton(btn, fn) {
  btn.addEventListener("pointerup", (e) => {
    if (e.pointerType === "mouse" || btn.disabled) return;
    const r = btn.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    fn();
  });
  btn.addEventListener("click", (e) => { if (e.detail === 0 || lastPointerType === "mouse") fn(); });
}
bindButton(document.getElementById("undo"), () => {
  if (!S.history.length) return;
  setPath(S.history.pop());
  S.cleared = false; S.clearedAt = null; S.stats.undo++;
  render();
});
bindButton(document.getElementById("reset"), () => {
  if (S.path.length > 1) S.history.push(S.path.slice());
  setPath([S.pz.start]);
  S.cleared = false; S.clearedAt = null; S.stats.reset++;
  render();
});
bindButton(document.getElementById("show-answer"), () => { S.showAnswer = !S.showAnswer; render(); });
modeEl.addEventListener("change", () => { S.mode = modeEl.value; });
styleEl.addEventListener("change", () => { S.thinStyle = styleEl.value; buildBoard(); render(); });
hideBandEl.addEventListener("change", render);
puzzleEl.addEventListener("change", () => load(puzzleEl.value));

document.addEventListener("keydown", (e) => {
  if (S.cleared || e.target.tagName === "SELECT") return;
  const dirs = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  const v = dirs[e.key];
  if (!v) return;
  e.preventDefault();
  const [r, c] = rc(head());
  const nr = r + v[0], nc = c + v[1];
  if (nr < 0 || nc < 0 || nr >= S.pz.h || nc >= S.pz.w) return;
  const before = S.path.slice();
  if (enter(nr * S.pz.w + nc, { dx: v[1], dy: v[0] }, true)) { S.history.push(before); render(); checkClear(); }
});

let layer = {};
function el(name, attrs, parent) {
  const n = document.createElementNS(SVGNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function buildBoard() {
  const { w, h } = S.pz;
  board.innerHTML = "";
  board.setAttribute("viewBox", `-0.06 -0.06 ${w + 0.12} ${h + 0.12}`);
  const cells = el("g", {}, board);
  layer.cells = [];
  for (let i = 0; i < w * h; i++) {
    const [r, c] = rc(i);
    layer.cells.push(el("rect", { x: c, y: r, width: 1, height: 1, "data-cell": i }, cells));
  }
  const grid = el("g", { stroke: "var(--grid)", "stroke-width": 0.03 }, board);
  for (let x = 1; x < w; x++) el("line", { x1: x, y1: 0, x2: x, y2: h }, grid);
  for (let y = 1; y < h; y++) el("line", { x1: 0, y1: y, x2: w, y2: y }, grid);
  layer.answer = el("polyline", { fill: "none", stroke: "var(--start)", "stroke-opacity": 0.35, "stroke-width": 0.12, "stroke-dasharray": "0.15 0.12", "stroke-linejoin": "round" }, board);
  layer.line = el("polyline", { fill: "none", stroke: "var(--line)", "stroke-width": 0.3, "stroke-linecap": "round", "stroke-linejoin": "round" }, board);
  const st = THIN_STYLES[S.thinStyle];
  const thin = el("g", { stroke: st.stroke, "stroke-width": st.width, "stroke-linecap": "round" }, board);
  const inset = st.inset ?? 0;
  for (const [a, b] of S.pz.thin) {
    const [ar, ac] = rc(a);
    if (b === a + 1) el("line", { x1: ac + 1, y1: ar + inset, x2: ac + 1, y2: ar + 1 - inset, "data-thin": `${a},${b}` }, thin);
    else el("line", { x1: ac + inset, y1: ar + 1, x2: ac + 1 - inset, y2: ar + 1, "data-thin": `${a},${b}` }, thin);
  }
  el("rect", { x: 0, y: 0, width: w, height: h, fill: "none", stroke: "#8f8877", "stroke-width": 0.06 }, board);
  const [sr, sc] = rc(S.pz.start);
  el("circle", { cx: sc + 0.5, cy: sr + 0.5, r: 0.34, fill: "var(--start)" }, board);
  layer.head = el("circle", { r: 0.22, fill: "#fff", stroke: "var(--line)", "stroke-width": 0.1 }, board);
}

const centers = (p) => p.map((c) => `${(c % S.pz.w) + 0.5},${Math.floor(c / S.pz.w) + 0.5}`).join(" ");
function render() {
  for (let i = 0; i < layer.cells.length; i++) {
    layer.cells[i].setAttribute("fill", S.wall[i] ? "var(--wall)" : S.pos[i] >= 0 ? "var(--visited)" : "var(--cell)");
  }
  layer.line.setAttribute("points", centers(S.path));
  layer.answer.setAttribute("points", S.showAnswer ? centers(S.pz.solution) : "");
  const hc = head();
  layer.head.setAttribute("cx", (hc % S.pz.w) + 0.5);
  layer.head.setAttribute("cy", Math.floor(hc / S.pz.w) + 0.5);
  layer.head.style.display = S.path.length > 1 ? "" : "none";
  remainEl.textContent = String(total() - S.path.length);
  const band = hideBandEl.checked && !S.cleared ? "?" : S.pz.band;
  labelEl.textContent = `${S.pz.w}×${S.pz.h}・帯${band}・仕切り${S.pz.thin.length}・壁${S.pz.walls.length}`;
  clearEl.classList.toggle("show", S.cleared);
  document.getElementById("undo").disabled = S.history.length === 0;
  recordEl.textContent = S.cleared
    ? `クリア ${(((S.clearedAt - (S.startedAt ?? S.clearedAt)) / 1000) | 0)}秒・1マス戻り${S.stats.retreat}・途中から${S.stats.rewind}回・元に戻す${S.stats.undo}回・最初から${S.stats.reset}回`
    : "";
}

// 帯を隠すときは、一覧の並びからも帯が分からないよう、盤面サイズ内の順を固定の乱順にする。
const shuffleKey = (id) => [...id].reduce((h, ch) => (Math.imul(h, 31) + ch.charCodeAt(0)) >>> 0, 7);
function buildPuzzleList() {
  const hide = hideBandEl.checked;
  const list = PUZZLES.slice().sort((a, b) => a.w - b.w || (hide ? shuffleKey(a.id) - shuffleKey(b.id) : a.band.localeCompare(b.band) || a.thin.length - b.thin.length));
  const current = S.pz?.id ?? list[0].id;
  puzzleEl.innerHTML = "";
  const counter = {};
  for (const p of list) {
    counter[p.w] = (counter[p.w] ?? 0) + 1;
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = hide
      ? `${p.w}×${p.h} 問${counter[p.w]}（仕切り${p.thin.length}・壁${p.walls.length}）`
      : `${p.w}×${p.h} 帯${p.band}（仕切り${p.thin.length}・壁${p.walls.length}）`;
    puzzleEl.appendChild(o);
  }
  puzzleEl.value = current;
}
hideBandEl.addEventListener("change", buildPuzzleList);
buildPuzzleList();

window.__poc = {
  state: () => ({ id: S.pz.id, path: S.path.slice(), cleared: S.cleared, history: S.history.length, total: total(), stats: { ...S.stats }, valid: validPath(S.path) }),
  load, puzzles: PUZZLES,
  set: (o) => { Object.assign(S, o); if (o.mode) modeEl.value = o.mode; if (o.thinStyle) { styleEl.value = o.thinStyle; buildBoard(); render(); } },
  usesCut: () => S.path.some((c, k) => k > 0 && S.cut.has(edgeKey(S.path[k - 1], c))),
};
load(puzzleEl.value);
</script>
</body>
</html>
