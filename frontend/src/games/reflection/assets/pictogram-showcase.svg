<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="リフレクション">
<style>.pz-reflection-laser{stroke:#f54900}.pz-reflection-laser-fill{fill:#f54900}.pz-reflection-exit{stroke:#155dfc}.pz-reflection-absorb{fill:#7f22fe}.dark .pz-reflection-laser{stroke:#ffb900}.dark .pz-reflection-laser-fill{fill:#ffb900}.dark .pz-reflection-exit{stroke:#51a2ff}.dark .pz-reflection-absorb{fill:#a684ff}.pz-reflection-pop{transform-box:fill-box;transform-origin:50% 50%}.pz-reflection-probe{stroke-dasharray:87.5 107.5;stroke-dashoffset:0}.pz-reflection-probe{opacity:0}.pz-reflection-ab{opacity:0}.pz-reflection-l2{stroke-dasharray:32 52;stroke-dashoffset:0}@media (prefers-reduced-motion: no-preference){[data-pictogram-motion="play"] .pz-reflection-probe{animation:pz-reflection-probe 4900ms linear infinite}[data-pictogram-motion="play"] .pz-reflection-ab{animation:pz-reflection-ab 4900ms linear infinite}[data-pictogram-motion="play"] .pz-reflection-l1{animation:pz-reflection-l1 4900ms linear infinite}[data-pictogram-motion="play"] .pz-reflection-m2{animation:pz-reflection-m2 4900ms linear infinite}[data-pictogram-motion="play"] .pz-reflection-l2{animation:pz-reflection-l2 4900ms linear infinite}[data-pictogram-motion="play"] .pz-reflection-bh{animation:pz-reflection-bh 4900ms linear infinite}@keyframes pz-reflection-probe{0%{opacity:1;stroke-dashoffset:89.5}6.122%{opacity:1;stroke-dashoffset:89.5;animation-timing-function:cubic-bezier(0.3,0,0.3,1)}25.51%{opacity:1;stroke-dashoffset:0}36.735%{opacity:1;stroke-dashoffset:0}36.755%{opacity:0;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}@keyframes pz-reflection-ab{0%{opacity:0}22.857%{opacity:0}26.122%{opacity:1}36.735%{opacity:1}36.755%{opacity:0}100%{opacity:0}}@keyframes pz-reflection-l1{0%{opacity:0}36.735%{opacity:0}36.755%{opacity:1}100%{opacity:1}}@keyframes pz-reflection-m2{0%{opacity:0;transform:scale(0.6)}36.735%{opacity:0;transform:scale(0.6);animation-timing-function:cubic-bezier(0.2,0.8,0.3,1)}42.857%{opacity:1;transform:none}100%{opacity:1;transform:none}}@keyframes pz-reflection-l2{0%{stroke-dashoffset:34}40.816%{stroke-dashoffset:34;animation-timing-function:cubic-bezier(0.5,0,0.9,0.6)}48.98%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}@keyframes pz-reflection-bh{0%{transform:none}48.571%{transform:none;animation-timing-function:cubic-bezier(0.2,0.7,0.3,1)}53.061%{transform:scale(1.18);animation-timing-function:cubic-bezier(0.4,0,0.4,1)}59.184%{transform:none}100%{transform:none}}}</style>
