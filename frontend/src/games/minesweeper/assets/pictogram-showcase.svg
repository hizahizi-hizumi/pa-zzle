[data-pictogram-motion="play"] .pz-minesweeper-ct20{animation:pz-minesweeper-ct20 4550ms linear infinite}
[data-pictogram-motion="play"] .pz-minesweeper-cv22{animation:pz-minesweeper-cv22 4550ms linear infinite}
[data-pictogram-motion="play"] .pz-minesweeper-ct22{animation:pz-minesweeper-ct22 4550ms linear infinite}
[data-pictogram-motion="play"] .pz-minesweeper-board{animation:pz-minesweeper-board 4550ms linear infinite}
@keyframes pz-minesweeper-cv11{0%{transform:scale(1);opacity:1}7.692%{transform:scale(1);opacity:1;animation-timing-function:cubic-bezier(0.3,0,0.2,1)}10.549%{transform:scale(0.84);opacity:1}12.088%{transform:scale(0.84);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.6,1)}16.044%{transform:scale(0.6);opacity:0}100%{transform:scale(0.6);opacity:0}}
