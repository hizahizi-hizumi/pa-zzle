<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="マインスイーパー">
<style>
.pz-minesweeper-hid{fill:#e2e8f0}.dark .pz-minesweeper-hid{fill:#314158}
.pz-minesweeper-flag{fill:#e7000b;stroke:#e7000b}.dark .pz-minesweeper-flag{fill:#ff6467;stroke:#ff6467}
.pz-minesweeper-n1{fill:#155dfc}.dark .pz-minesweeper-n1{fill:#51a2ff}
.pz-minesweeper-n2{fill:#007a55}.dark .pz-minesweeper-n2{fill:#00d492}
.pz-minesweeper-mine{fill:#314158;stroke:#314158}.dark .pz-minesweeper-mine{fill:#e2e8f0;stroke:#e2e8f0}
.pz-minesweeper-cv11{transform-box:view-box;transform-origin:60px 60px;transform:scale(0.6);opacity:0}
.pz-minesweeper-ct11{transform-box:view-box;transform-origin:60px 60px;transform:scale(1);opacity:1}
.pz-minesweeper-cv02{transform-box:view-box;transform-origin:88px 32px;transform:scale(0.6);opacity:0}
.pz-minesweeper-cv20{transform-box:view-box;transform-origin:32px 88px;transform:scale(0.6);opacity:0}
.pz-minesweeper-ct20{transform-box:view-box;transform-origin:32px 88px;transform:scale(1);opacity:1}
.pz-minesweeper-cv22{transform-box:view-box;transform-origin:88px 88px;transform:scale(0.6);opacity:0}
.pz-minesweeper-ct22{transform-box:view-box;transform-origin:88px 88px;transform:scale(1);opacity:1}
.pz-minesweeper-board{transform-box:view-box;transform-origin:60px 60px;transform:scale(1)}
@media (prefers-reduced-motion: no-preference){
[data-pictogram-motion="play"] .pz-minesweeper-cv11{animation:pz-minesweeper-cv11 4550ms linear infinite}
[data-pictogram-motion="play"] .pz-minesweeper-ct11{animation:pz-minesweeper-ct11 4550ms linear infinite}
[data-pictogram-motion="play"] .pz-minesweeper-cv02{animation:pz-minesweeper-cv02 4550ms linear infinite}
