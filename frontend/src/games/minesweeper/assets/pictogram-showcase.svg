@keyframes pz-minesweeper-cv02{0%{transform:scale(1);opacity:1}20.879%{transform:scale(1);opacity:1;animation-timing-function:cubic-bezier(0.3,0,0.2,1)}23.736%{transform:scale(0.84);opacity:1}25.275%{transform:scale(0.84);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.6,1)}29.231%{transform:scale(0.6);opacity:0}100%{transform:scale(0.6);opacity:0}}
@keyframes pz-minesweeper-cv20{0%{transform:scale(1);opacity:1}34.066%{transform:scale(1);opacity:1;animation-timing-function:cubic-bezier(0.3,0,0.2,1)}36.923%{transform:scale(0.84);opacity:1}38.462%{transform:scale(0.84);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.6,1)}42.418%{transform:scale(0.6);opacity:0}100%{transform:scale(0.6);opacity:0}}
@keyframes pz-minesweeper-ct20{0%{transform:scale(0.5);opacity:0}39.78%{transform:scale(0.5);opacity:0;animation-timing-function:cubic-bezier(0.34,1.5,0.64,1)}45.934%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pz-minesweeper-cv22{0%{transform:scale(1);opacity:1}42.857%{transform:scale(1);opacity:1;animation-timing-function:cubic-bezier(0.4,0,0.6,1)}47.253%{transform:scale(0.6);opacity:0}100%{transform:scale(0.6);opacity:0}}
@keyframes pz-minesweeper-ct22{0%{transform:scale(0.5);opacity:0}44.176%{transform:scale(0.5);opacity:0;animation-timing-function:cubic-bezier(0.34,1.5,0.64,1)}50.33%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pz-minesweeper-board{0%{transform:scale(1)}42.857%{transform:scale(1);animation-timing-function:cubic-bezier(0.3,0,0.2,1)}50.11%{transform:scale(1.04);animation-timing-function:cubic-bezier(0.4,0,0.6,1)}58.242%{transform:scale(1)}100%{transform:scale(1)}}
}
</style>
