version: 1
id: views

paths:
  - frontend/src/views/**/*.tsx

source:
  path: .claude/rules/views.md

defaults:
  status: draft
  severity: warning
  violationThreshold: 0.90

rules:
  - id: no-domain-logic
    title: Viewはドメインや機能固有の規則を実装しない
    scope: file
    sourceSection: Views > 所有しないもの
    predicate:
      instruction: |
        Determine whether this View acts as a composition boundary rather than
        implementing game, domain, persistence, scoring, or other feature rules.
      outcomes:
        violation: |
          The View itself implements domain or feature-specific rules, scoring,
          persistence behavior, game logic, or reusable cross-view behavior that
          belongs to another responsibility.
        compliant: |
          The View connects routing, hooks, use cases, screen-local state,
          layout, and UI composition while delegating domain and feature rules
          to the responsibilities that own them.
        not_applicable: |
          The file is not acting as a View or contains no behavior relevant to
          this responsibility boundary.
        insufficient_context: |
          The available file does not provide enough context to tell whether a
          piece of logic is screen composition or an independently owned rule.
