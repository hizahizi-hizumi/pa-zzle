# 人間向け規約の正本: .claude/rules/vitest.md
version: 1
id: vitest

paths:
  - frontend/**/*.test.ts
  - frontend/**/*.test.tsx
  - frontend/**/*.test.mjs

rules:
  - id: arrange-outside-test
    title: テスト本体にArrangeを置かない
    unit: test
    # golden benchmark (3 runs) の校正の推奨値で、leave-one-file-outで選ばれたthresholdの平均0.66（0.65〜0.85）。
    # 違反と非違反の確率は両端に分かれ、0.35〜0.60の違反箇所の厳密P/R 0.96 / 0.93、0.70で0.97 / 0.90。
    violationThreshold: 0.65
    instruction: |
      A test body must not perform meaningful Arrange work. Such setup belongs
      in an enclosing describe, beforeEach, or test.each case data.
      Violation: the test body constructs test data or initial state, creates
      mocks or spies, or performs initial rendering.
      Not a violation: using values received from test.each parameters;
      assigning the result of the operation under test, which is Act; a test
      that needs no meaningful Arrange.

  - id: before-each-arrange-only
    title: beforeEachは事前準備だけを行う
    unit: setup
    # goldenに違反例がなく校正できない。非違反の違反確率は最大約0.25で、誤指摘は出ない。
    violationThreshold: 0.90
    instruction: |
      A beforeEach must perform Arrange only.
      Violation: it executes an operation, user action, or behavior whose
      result a test later verifies.
      Not a violation: it only prepares initial state, test data, mocks, spies,
      dependencies, or initial rendering.

  - id: dom-observable-contract
    title: DOMテストは利用者から観測できる契約を優先する
    unit: test
    # goldenの違反（内部data属性やCSS selectorでの取得）を含むtestをunit単位で違反と
    # 判定できず、どのthresholdでも一致しない。非違反の違反確率は最大約0.91のため、
    # 誤指摘が出ない0.95にする。
    violationThreshold: 0.95
    instruction: |
      A DOM-oriented test must verify user-observable contracts rather than
      incidental implementation details.
      Violation: the test primarily asserts incidental implementation details
      even though the intended behavior could reasonably be verified through
      roles, accessible names, visible content, or observable results after
      user interaction.
      Not a violation: the test primarily verifies behavior through those
      means; the test is not DOM-oriented.

  - id: table-driven-cases
    title: 同じ期待動作の入力違いはtest.eachで表現する
    unit: test-group
    # golden benchmark (3 runs) のleave-one-file-out校正で選ばれたthresholdの中央値。
    # 違反例は1ファイルだけで、違反確率約0.75と非違反の最大約0.16の間にある。
    violationThreshold: 0.50
    instruction: |
      Repeated test cases in a describe that verify the same expected behavior
      with different inputs must use test.each.
      Violation: two or more separate test cases repeat substantially the same
      Act and Assert structure and differ mainly in input or expected values.
      Not a violation: repeated cases already use test.each; separate tests
      verify materially different behaviors that deserve independent cases;
      the describe has no such repeated cases.

  - id: no-condition-in-test-title
    title: テスト名に「場合」「時」を含めない
    unit: test-title
    # golden benchmark (3 runs) の推奨値。leave-one-file-outで選ばれたthresholdは0.55〜0.95（平均0.85）。
    # 0.90で指摘位置の厳密P/R 0.90 / 0.86。残る誤指摘は「〜中に」「ときは」など、場合・時を含まない条件の表現。
    violationThreshold: 0.90
    instruction: |
      A test case name must not contain the word 場合 or the word 時, because
      conditions belong in an enclosing describe name.
      Violation: the name contains 場合, or 時 as its own word meaning when,
      such as 手詰まり時, 通常時, 開始時, or した時.
      Not a violation: 時 inside another word such as 時間, 時計, 時刻, 時点,
      or 同時; a condition written without 場合 or 時, such as with とき or
      なら, which is outside this rule.

  - id: test-title-describes-behavior
    title: テスト名は具体的な期待動作を散文で書き、識別子は実際の表記を保つ
    unit: test-title
    violationThreshold: 0.5
    instruction: |
      A test case name must be Japanese prose that states a concrete expected
      behavior, so that a reader can tell what is expected and, for test.each,
      which case failed. Identifiers keep their code notation.
      Violation: the name is not prose, such as a bare identifier, a code
      fragment, or a label like 正常系 or ケース1; the name is too vague to
      tell the expected behavior, such as 正しく動くこと or 期待どおりであること;
      a test.each name does not describe the condition or case content, so a
      failing case cannot be told apart; a helper, variable, or parameter that
      the test code refers to is paraphrased in prose instead of written as
      its identifier; a machine identifier or literal that the test verifies,
      such as a CLI option, enum value, ID, or path, is paraphrased instead of
      kept as written.
      Not a violation: describing domain concepts in Japanese prose even when
      the code models them with identifiers; a name that includes the actual
      notation of values; whether the name ends with こと or contains 場合 or
      時, which other rules check.

  - id: describe-title
    title: describeの名前は条件か対象の識別子で、モジュール名を繰り返さない
    unit: test-group-title
    violationThreshold: 0.5
    instruction: |
      A describe name must be either a condition written as <condition>の場合,
      or the name of the function, method, class, or component under test
      written exactly as its code identifier. The test file itself represents
      the module under test, so a describe must not merely repeat the module
      name.
      Violation: a describe that groups cases by a condition but is not
      written as <condition>の場合; a describe for a target whose name
      paraphrases or translates the target instead of using its identifier,
      such as 合計 for sum; a describe whose name is the module name of the
      test file (the file name without .test and its extension, including a
      component or hook named after the module, such as useFoo in
      use-foo.test.ts or Foo in Foo.test.tsx).
      Not a violation: a condition written as <condition>の場合, including a
      describe.each name with a placeholder; an identifier of a function,
      method, class, type, or component defined in the module that differs
      from the module name.

  - id: describe-per-target
    title: 同じ対象を検証する複数のケースは対象名のdescribeでまとめる
    unit: file
    violationThreshold: 0.5
    instruction: |
      When several test cases verify the same function, method, or component,
      they must be grouped in a describe named after that target.
      Violation: two or more test cases that verify the same target are not
      inside a describe for that target, such as top-level tests or tests
      spread across unrelated describes.
      Not a violation: a target verified by only one test case; tests already
      grouped in a describe for their target or in a condition describe inside
      it; a file whose tests all verify the module's single main target named
      after the module, because the file itself represents it and a describe
      repeating the module name is not wanted.

  - id: act-assert-separation
    title: ActとAssertを分離し、テスト対象の実行をexpectに埋め込まない
    unit: test
    violationThreshold: 0.5
    instruction: |
      A test must keep Arrange, Act, and Assert as clearly separated phases.
      Act runs the code under test explicitly and stores its return value or
      observed result in a variable, and Assert verifies it afterwards.
      Violation: expect(...) directly wraps a call to the code under test,
      such as expect(parse(input)).toBe(1); Act and Assert alternate, such as
      running the code under test again after an assertion.
      Not a violation: expect wrapping a query or helper that only reads an
      observed result, such as screen.getByRole(...), a spy, or a property of
      the stored result; expect(act).toThrow() where act is a function created
      in Act; awaiting a user event and then asserting once; Arrange inside
      the test body, which another rule checks.

  - id: dom-query-matches-contract
    title: DOMクエリは検証する契約に合わせて選ぶ
    unit: test
    violationThreshold: 0.5
    instruction: |
      DOM queries must be chosen to match the contract the test verifies;
      getByRole must not be a mechanical default. Use getByRole when the
      element's role and its name identify it as the contract, getByText when
      the displayed text is the contract, and getByLabelText when the
      association between a label and a form control is the contract.
      Violation: getByRole, queryByRole, findByRole, or their All variants
      find an element whose role semantics the test does not rely on, only to
      reach displayed text or content, such as getByRole("button", { name:
      "5" }) to find a digit shown on screen; a query that does not match the
      contract, such as getByText for a form control identified by its label.
      Not a violation: getByRole for an element the user operates or
      identifies by its role, such as a button to click, a dialog, or a
      heading; tests without DOM queries.

  - id: immutable-data-as-const
    title: 不変のテストデータはbeforeEachで作り直さずdescribeのconstにする
    unit: setup
    violationThreshold: 0.5
    instruction: |
      Immutable input values, expected values, and test data must be defined
      as const in the describe scope, not rebuilt in beforeEach or beforeAll.
      Violation: the hook creates or assigns values that neither the tests
      nor the code under test modify, such as fixed inputs, expected results,
      or plain data objects, only to share them with tests.
      Not a violation: preparing state that must be recreated for each test,
      such as mutable objects, mocks, spies, timers, storage, or rendering.

  - id: per-test-state-in-before-each
    title: テストごとに作り直す状態はdescribeのconstで共有せずbeforeEachで準備する
    unit: test-group
    violationThreshold: 0.5
    instruction: |
      State, mocks, spies, and rendering that must be recreated for each test
      must be prepared in beforeEach, not shared as a const in the describe
      scope. Judge only declarations made directly in this describe's
      callback, not those in nested describes, tests, or hooks.
      Violation: such a declaration holds a value shared by several tests
      that must be recreated per test, such as a mutable object that the
      tests or the code under test change, a mock or spy function, or a
      rendered result.
      Not a violation: immutable inputs, expected values, and test data;
      functions and helpers; a let declared in the describe and assigned in
      beforeEach; a describe without such declarations.
