version: 1
id: vitest

paths:
  - frontend/**/*.test.ts
  - frontend/**/*.test.tsx
  - frontend/**/*.test.mjs

source:
  path: .claude/rules/vitest.md

defaults:
  status: draft
  severity: warning
  violationThreshold: 0.90

rules:
  - id: arrange-outside-test
    status: active
    title: テスト本体にArrangeを置かない
    context: vitest.test
    target: statement
    sourceSection: テスト構造 > Arrangeの分離方法
    predicate:
      instruction: |
        Determine whether the target statement performs meaningful Arrange work
        that should live outside the enclosing test. Use the enclosing test and
        full file only as context for interpreting the target statement.
      outcomes:
        violation: |
          The target statement performs meaningful Arrange work such as
          constructing test data or initial state, creating mocks or spies, or
          performing initial rendering. Values received from test.each parameters
          are allowed.
        compliant: |
          The target statement is Act or Assert, or otherwise belongs naturally
          in the test body rather than Arrange setup.
        not_applicable: |
          The target statement has no meaningful relationship to Arrange, Act,
          or Assert for this rule.
        insufficient_context: |
          The enclosing test and file do not provide enough information to
          determine whether the target statement is Arrange.

  - id: before-each-arrange-only
    status: active
    title: beforeEachは事前準備だけを行う
    context: vitest.beforeEach
    target: statement
    sourceSection: テスト構造 > Arrangeの分離方法
    predicate:
      instruction: |
        Determine whether the target statement inside beforeEach executes
        behavior that a test later verifies instead of preparing initial state.
        Use the enclosing beforeEach and full file only as context.
      outcomes:
        violation: |
          The target statement executes an operation, user action, or behavior
          whose result is subsequently verified by a test.
        compliant: |
          The target statement prepares initial state, test data, mocks, spies,
          dependencies, or initial rendering.
        not_applicable: |
          The target statement is not relevant to the Arrange-only responsibility
          of beforeEach.
        insufficient_context: |
          The enclosing hook and file do not provide enough information to
          determine whether the target statement is setup or behavior under test.

  - id: dom-observable-contract
    title: DOMテストは利用者から観測できる契約を優先する
    context: vitest.test
    target: self
    sourceSection: テスト構造 > 基本原則
    predicate:
      instruction: |
        Determine whether this DOM-oriented test verifies user-observable
        contracts rather than incidental implementation details.
      outcomes:
        violation: |
          The test primarily asserts incidental implementation details even
          though the intended behavior could reasonably be verified through
          roles, accessible names, visible content, or observable results after
          user interaction.
        compliant: |
          The test primarily verifies behavior through roles, accessible names,
          visible content, or results observable after user interaction.
        not_applicable: |
          This test is not DOM-oriented.
        insufficient_context: |
          The available file context is not enough to determine whether the
          asserted detail is an intended user-facing contract.

  - id: table-driven-cases
    status: active
    title: 同じ期待動作の入力違いはtest.eachで表現する
    context: vitest.describe
    target: self
    sourceSection: 入力違いのケース
    predicate:
      instruction: |
        Determine whether repeated test cases in this describe verify the same
        expected behavior with different inputs and therefore should use
        test.each.
      outcomes:
        violation: |
          Two or more separate test cases repeat substantially the same Act and
          Assert structure and differ mainly in input or expected values.
        compliant: |
          Repeated cases already use test.each, or separate tests verify
          materially different behaviors that deserve independent cases.
        not_applicable: |
          The describe contains no repeated cases representing the same behavior
          with different inputs or expected values.
        insufficient_context: |
          The available file context is not enough to determine whether
          superficially similar tests represent the same expected behavior.
