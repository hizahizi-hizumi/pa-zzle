version: 1
id: game-problem

paths:
  - frontend/src/games/*/problem/problem.ts

source:
  path: .claude/rules/game-structure.md

defaults:
  status: draft
  severity: warning
  violationThreshold: 0.90

rules:
  - id: playable-data-only
    title: Problem契約は1問を遊ぶために必要な情報だけを持つ
    scope: file
    sourceSection: ゲーム実装の標準構造 > 問題契約
    predicate:
      instruction: |
        Determine whether this problem contract contains only information needed
        to play one problem, leaving generation identity and generation-internal
        details outside the playable problem contract.
      outcomes:
        violation: |
          The playable problem contract includes generation identity or internal
          generation/search details such as seed, generator version,
          generation conditions, attempt counts, search traces, or solver
          history that are not needed to play the problem.
        compliant: |
          The playable problem contract contains only data required during play.
          Reproduction metadata is separated into a ProblemIdentity-like
          contract, and downstream-required generation results are represented
          as meaningful derived values outside the core playable contract.
        not_applicable: |
          The file does not define or own the playable problem contract.
        insufficient_context: |
          The available file does not make it clear whether a field is required
          during play or exists only for generation/reproduction purposes.
