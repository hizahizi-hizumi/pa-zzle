version: 1

rulesDir: .semantic-lint/rules
# 評価専用のruleset。bench / doctorだけが読み、checkでは実行しない。
evalRulesDir: .semantic-lint/eval-rules
goldenDir: .semantic-lint/golden

excludePaths:
  - "**/.env*"
  - "**/*.pem"
  - "**/*.key"
  - "**/node_modules/**"
  - "**/dist/**"

execution:
  concurrency: 8
  # 1ファイルの全rule × 全unitを、この上限に収まる限り1 requestにまとめる。
  # providerの入力上限は公開されておらず、推定55,600 tokensのrequestは通り、推定64,000付近は
  # max_tokens_exceededで拒否される。推定は±5%程度ずれるため、totalは既定より小さくして余裕を取る。
  requestTokenBudget:
    stateAndQuestion: 32000
    total: 52000

provider:
  kind: typesafe
  # 別名 (jev-latest) ではなく版で固定する。判定cacheのkeyとruleのthresholdはこの版を前提にするため、
  # 上げるときはbenchで全ruleを測り直し、必要ならthresholdを再校正する。
  model: jev-1.13.0
  apiKeyEnv: TYPESAFE_API_KEY
