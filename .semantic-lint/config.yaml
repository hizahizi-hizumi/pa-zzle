version: 1

rulesDir: .semantic-lint/rules
# 評価専用のruleset。bench / doctorだけが読み、checkでは実行しない。
evalRulesDir: .semantic-lint/eval-rules
goldenDir: .semantic-lint/golden

excludePaths:
  - "**/.env*"
  - "**/*.pem"
  - "**/*.key"
  - "**/node_modules/**"
  - "**/dist/**"

execution:
  concurrency: 8
  # 1ファイルの全rule × 全unitを、この上限に収まる限り1 requestにまとめる。
  requestTokenBudget:
    stateAndQuestion: 32000
    total: 64000

provider:
  kind: typesafe
  model: jev-latest
  apiKeyEnv: TYPESAFE_API_KEY
