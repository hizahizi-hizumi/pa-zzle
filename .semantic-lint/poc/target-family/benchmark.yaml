version: 1

rules:
  - id: arrange-outside-test
    title: テスト本体にArrangeを置かない
    targetFamily: callback-statement
    violationThreshold: 0.85
    predicate:
      instruction: |
        判定対象自身が、Vitestのtest / itコールバック直下の1つのstatementであり、
        規約上describe側のconstまたはbeforeEachへ移すべきArrangeか判定する。
        context.call.calleeとenclosingCallsはparser由来の包含情報として使う。
        test / it以外のcallback直下のstatementはviolationにしない。
      outcomes:
        violation: |
          判定対象自身がtest / itコールバック内部のArrangeである。
          不変の入力値・期待値・テストデータ、状態構築、mock・spy構築、初期renderなど、
          describe側のconstまたはbeforeEachで準備すべき処理に該当する。
        compliant: |
          判定対象自身はActまたはAssertである。
          またはArrangeであっても、既にdescribe側やbeforeEachに適切に置かれている。
          test内で行うこと自体が検証対象の操作である処理もここに含む。
        not_applicable: |
          判定対象がtest / itコールバック直下の個別処理ではない。
        insufficient_context: |
          周辺コードを見てもArrange / Act / Assert上の役割を判断できない。

  - id: before-each-arrange-only
    title: beforeEachは事前準備だけを行う
    targetFamily: callback-call
    violationThreshold: 0.90
    predicate:
      instruction: |
        判定対象自身がcallbackを持つcallである。
        context.call.calleeがbeforeEachのときだけ、事前準備だけを行い、
        後続testが検証する操作・振る舞いを先に実行していないか判定する。
      outcomes:
        violation: |
          判定対象自身がbeforeEachであり、後続testが検証する操作、ユーザー操作、
          またはその結果を生む振る舞いを実行している。
        compliant: |
          判定対象自身がbeforeEachであり、初期状態、テストデータ、mock、spy、依存関係、
          初期renderなどのArrangeだけを行っている。
        not_applicable: |
          判定対象自身がbeforeEachではない。
        insufficient_context: |
          file全体を見てもbeforeEach内の処理が準備か検証対象の振る舞いか判断できない。

  - id: dom-observable-contract
    title: DOMテストは利用者から観測できる契約を優先する
    targetFamily: callback-call
    violationThreshold: 0.90
    predicate:
      instruction: |
        判定対象自身がcallbackを持つcallである。
        context.call.calleeがtest / itのDOMテストである場合だけ、
        主なAssertが利用者から観測できる契約ではなく偶発的な実装詳細を検証していないか判定する。
        内部class、data属性、DOM構造そのものを検証していても、同じ意図をrole、accessible name、
        表示内容、ユーザー操作後の観測結果で合理的に検証できない場合は直ちにviolationとしない。
      outcomes:
        violation: |
          判定対象自身がDOM-oried testで、主なAssertが内部class、data属性、偶発的DOM構造などの
          実装詳細に依存し、意図した振る舞いを利用者から観測できる契約で合理的に検証できる。
        compliant: |
          判定対象自身がDOM-oried testで、role、accessible name、表示内容、
          ユーザー操作後の観測結果など意図した利用者契約を主に検証している。
        not_applicable: |
          判定対象自身がtest / itではない、またはDOM-oriented testではない。
        insufficient_context: |
          file全体を見ても、検証している詳細が意図した契約か偶発的実装か判断できない。

  - id: table-driven-cases
    title: 同じ期待動作の入力違いはtest.eachで表現する
    targetFamily: relation-group
    violationThreshold: 0.70
    predicate:
      instruction: |
        判定対象自身が、同じ親の下に並ぶ兄弟test / it同士のrelationであ㒊、
        それらが同じ期待動作を入力値または期待値の違いだけで繰り返しているか判定する。
        relationのsourceとcontextは比較対象の兄弟群を表す。
        個々のtest / itやtest / it以外のrelationは、このルールのviolationにしない。
        構造が同じであること自体は候補生成の根拠にすぎず、同じ期待動作である根拠にはしない。

        判定例:
        - violation:
          test("abcを正規化すること", () => {
            const result = normalizeCode("abc");
            expect(result).toBe("ABC");
          });
          test("xyzを正規化すること", () => {
            const result = normalizeCode("xyz");
            expect(result).toBe("XYZ");
          });
          同じ正規化という期待動作を入力・期待値だけ変えて繰り返している。
        - compliant:
          test("所有者は編集できること", () => {
            const result = canEdit({ isOwner: true, isAdmin: false });
            expect(result).toBe(true);
          });
          test("管理者は編集できること", () => {
            const result = canEdit({ isOwner: false, isAdmin: true });
            expect(result).toBe(true);
          });
          構造は同じでも、所有者権限と管理者権限という別の業務規則を検証している。
      outcomes:
        violation: |
          判定対象自身が兄弟test / it同士のrelationであり、各testのActとAssertが意味的に同じで、
          主な差分が入力値または期待値だけである。test.eachへ統合しても期待動作の意味が変わらない。
        compliant: |
          判定対象自身は兄弟test / it同士のrelationだが、前提条件・期待動作・Act・Assertに
          別testとして表現する意味のある差がある。または既にtest.eachで表現されている。
        not_applicable: |
          判定対象自身がrelationではない、またはrelationの構成要素が兄弟test / itではない。
        insufficient_context: |
          兄弟testの内容を比較しても、同じ期待動作の入力違いか判断できない。

cases:
  - rule: arrange-outside-test
    name: Arrangeを1件だけ指す
    fixture: ../fixtures/arrange-single.ts
    expectedFindings:
      - text: const values = [1, 2, 3];
  - rule: arrange-outside-test
    name: 連続するArrangeを別findingで指す
    fixture: ../fixtures/arrange-three.ts
    expectedFindings:
      - text: const name = "Alice";
      - text: const age = 20;
      - text: const input = { name, age };
  - rule: arrange-outside-test
    name: test外のArrangeは指さない
    fixture: ../fixtures/arrange-none.ts
    expectedFindings: []
  - rule: arrange-outside-test
    name: 親targetへ違反を伝播させない
    fixture: ../fixtures/arrange-nested-parent.ts
    expectedFindings:
      - text: const values = [1, 2, 3];
  - rule: arrange-outside-test
    name: GamePictogramの初期renderを指す
    fixture: ../holdout/fixtures/arrange-inline-render.tsx
    expectedFindings:
      - text: const { container } = render(<GamePictogram svg={svg} />);
  - rule: arrange-outside-test
    name: Nanpure boardの入力値だけをArrangeとして指す
    fixture: ../holdout/fixtures/arrange-input-vs-act.ts
    expectedFindings:
      - text: const cellIndex = 50;
  - rule: arrange-outside-test
    name: beforeEach内のmockとrenderを指さない
    fixture: ../holdout/fixtures/arrange-before-each.tsx
    expectedFindings: []
  - rule: arrange-outside-test
    name: test.each内の生成と評価をActとして扱う
    fixture: ../holdout/fixtures/arrange-test-each.ts
    expectedFindings: []
  - rule: arrange-outside-test
    name: 例外検証用入力だけをArrangeとして指す
    fixture: ../holdout/fixtures/arrange-invalid-board.ts
    expectedFindings:
      - text: |-
          const board = Array.from({ length: NANPURE_CELL_COUNT - 1 }, () => null);

  - rule: before-each-arrange-only
    name: beforeEachで検証対象の操作まで実行する
    fixture: ../../cases/vitest/fixtures/before-each-arrange-only/violation.ts
    expectedFindings:
      - range: { startLine: 5, startColumn: 3, endLine: 8, endColumn: 6 }
  - rule: before-each-arrange-only
    name: beforeEachでは初期状態だけを作る
    fixture: ../../cases/vitest/fixtures/before-each-arrange-only/compliant.ts
    expectedFindings: []
  - rule: before-each-arrange-only
    name: beforeEachのユーザー操作を指す
    fixture: fixtures/before-each-behavior.tsx
    expectedFindings:
      - range: { startLine: 4, startColumn: 3, endLine: 8, endColumn: 6 }
  - rule: before-each-arrange-only
    name: beforeEachのrenderだけは指さない
    fixture: fixtures/before-each-setup.tsx
    expectedFindings: []

  - rule: dom-observable-contract
    name: 内部data属性だけを検証する
    fixture: ../../cases/vitest/fixtures/dom-observable-contract/violation.tsx
    expectedFindings:
      - range: { startLine: 1, startColumn: 1, endLine: 6, endColumn: 4 }
  - rule: dom-observable-contract
    name: 利用者に見える状態を検証する
    fixture: ../../cases/vitest/fixtures/dom-observable-contract/compliant.tsx
    expectedFindings: []
  - rule: dom-observable-contract
    name: 内部classだけを検証する
    fixture: fixtures/dom-internal-class.tsx
    expectedFindings:
      - range: { startLine: 1, startColumn: 1, endLine: 6, endColumn: 4 }
  - rule: dom-observable-contract
    name: 表示内容を検証する
    fixture: fixtures/dom-visible-text.tsx
    expectedFindings: []

  - rule: table-driven-cases
    name: 調整用の反復
    fixture: ../fixtures/table-driven.ts
    expectedFindings:
      - range: { startLine: 2, startColumn: 3, endLine: 12, endColumn: 6 }
  - rule: table-driven-cases
    name: 既存test.each
    fixture: ../holdout/fixtures/table-existing-each.ts
    expectedFindings: []
  - rule: table-driven-cases
    name: 異なる操作の兄弟test
    fixture: ../holdout/fixtures/table-distinct-actions.tsx
    expectedFindings: []
  - rule: table-driven-cases
    name: 効率の反復
    fixture: ../holdout/fixtures/table-repeated-efficiency.ts
    expectedFindings:
      - range: { startLine: 2, startColumn: 3, endLine: 24, endColumn: 6 }
  - rule: table-driven-cases
    name: 速さの反復
    fixture: ../holdout/fixtures/table-repeated-speed.ts
    expectedFindings:
      - range: { startLine: 2, startColumn: 3, endLine: 24, endColumn: 6 }
  - rule: table-driven-cases
    name: 構造は同じだが異なる業務規則
    fixture: ../relation-group/fixtures/table-semantic-distinct.ts
    expectedFindings: []
