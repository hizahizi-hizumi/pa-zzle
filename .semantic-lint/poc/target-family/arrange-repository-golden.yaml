version: 1
rules:
- id: arrange-outside-test
  title: テスト本体にArrangeを置かない
  targetFamily: callback-statement
  violationThreshold: 0.85
  predicate:
    instruction: |
      判定対象自身が、Vitestのtest / itコールバック直下の1つのstatementであり、
      規約上describe側のconstまたはbeforeEachへ移すべきArrangeか判定する。
      context.callはparser由来で、callee、test名などのlabel、statementの位置を表す。
      test / it以外のcallback直下のstatementはviolationにしない。
    outcomes:
      violation: |
        判定対象自身がtest / itコールバック内部のArrangeである。
        不変の入力値・期待値・テストデータ、状態構築、mock・spy構築、初期renderなど、
        describe側のconstまたはbeforeEachで準備すべき処理に該当する。
      compliant: |
        判定対象自身はActまたはAssertである。
        またはArrangeであっても、既にdescribe側やbeforeEachに適切に置かれている。
        test内で行うこと自体が検証対象の操作である処理もここに含む。
      not_applicable: |
        判定対象がtest / itコールバック直下の個別処理ではない。
      insufficient_context: |
        周辺コードを見てもArrange / Act / Assert上の役割を判断できない。
