version: 1

rules:
  - id: arrange-outside-test
    title: テスト本体にArrangeを置かない
    violationThreshold: 0.90
    predicate:
      instruction: |
        判定対象自身が、Vitestのtest / itコールバック内部に置かれたArrangeであり、
        規約上describe側のconstまたはbeforeEachへ移すべき処理か判定する。
        周辺コードは、判定対象の包含関係と役割を判断するためだけに使う。
        子孫・親・兄弟など別のコードに違反があることを理由に、判定対象をviolationにしない。
      outcomes:
        violation: |
          判定対象自身がtest / itコールバック内部のArrangeである。
          不変の入力値・期待値・テストデータ、状態構築、mock・spy構築、初期renderなど、
          describe側のconstまたはbeforeEachで準備すべき処理に該当する。
        compliant: |
          判定対象自身はActまたはAssertである。
          またはArrangeであっても、既にdescribe側やbeforeEachに適切に置かれている。
          test内で行うこと自体が検証対象の操作である処理もここに含む。
        not_applicable: |
          判定対象自身がArrange / Act / Assertとして評価する個別処理ではない。
          test / describeなどのコンテナや、この規約の対象にならない宣言・構造を含む。
        insufficient_context: |
          周辺コードを見ても、判定対象の包含位置またはArrange / Act / Assert上の役割を判断できない。

  - id: meaningful-variable-name
    title: 変数名は保持する値や役割を表す
    violationThreshold: 0.90
    predicate:
      instruction: |
        判定対象の変数宣言について、変数名が保持する値や役割を具体的に表しているか判定する。
        判定対象そのものを分類し、子孫や周辺コードに別の問題があるだけならviolationにしない。
      outcomes:
        violation: |
          hoge、fuga、tmp、dataなど、周辺文脈と初期値を見ても保持する値や役割を具体的に表さない名前である。
        compliant: |
          変数名が保持する値や役割を十分に表している。
        not_applicable: |
          判定対象が変数宣言ではない、または命名規約の対象ではない。
        insufficient_context: |
          周辺コードを見ても名前が適切か判断できない。

  - id: table-driven-cases
    title: 同じ期待動作の入力違いはtest.eachで表現する
    violationThreshold: 0.90
    predicate:
      instruction: |
        判定対象自身が、2つ以上の兄弟test / itを直接包含する最小のコンテナであり、
        それらが同じ期待動作を入力値または期待値の違いだけで繰り返しているか判定する。
        個々のtest / itやその内部処理は、このルールのviolationにしない。
        周辺コードは、兄弟test間のAct・Assert・入力・期待値を比較するためだけに使う。
      outcomes:
        violation: |
          判定対象自身が2つ以上の兄弟test / itを直接包含し、
          各testのActとAssertが意味的に同じで、主な差分が入力値または期待値だけである。
          1つのtest.eachへ統合しても検証する期待動作の意味が変わらない。
        compliant: |
          判定対象自身は2つ以上の兄弟test / itを直接包含するが、
          前提条件・期待動作・Act・Assertに別testとして表現する意味のある差がある。
          または既にtest.eachで表現されている。
        not_applicable: |
          判定対象自身が比較対象となる2つ以上の兄弟test / itを直接包含していない。
          個々のtest / it、その内部のAct・Assert・変数宣言などを含む。
        insufficient_context: |
          兄弟testの内容を比較しても、同じ期待動作の入力違いか判断できない。

cases:
  - rule: arrange-outside-test
    name: Arrangeを1件だけ指す
    fixture: fixtures/arrange-single.ts
    expectedFindings:
      - text: const values = [1, 2, 3];

  - rule: arrange-outside-test
    name: 連続するArrangeを別findingで指す
    fixture: fixtures/arrange-three.ts
    expectedFindings:
      - text: const name = "Alice";
      - text: const age = 20;
      - text: const input = { name, age };

  - rule: arrange-outside-test
    name: test外のArrangeは指さない
    fixture: fixtures/arrange-none.ts
    expectedFindings: []

  - rule: meaningful-variable-name
    name: 命名違反はidentifierだけを指す
    fixture: fixtures/name-single.ts
    expectedFindings:
      - text: hoge

  - rule: meaningful-variable-name
    name: 同じ行の複数identifierから違反名だけを指す
    fixture: fixtures/name-same-line.ts
    expectedFindings:
      - text: hoge

  - rule: arrange-outside-test
    name: 親candidateへ違反を伝播させない
    fixture: fixtures/arrange-nested-parent.ts
    expectedFindings:
      - text: const values = [1, 2, 3];

  - rule: table-driven-cases
    name: describe全体の反復を指す
    fixture: fixtures/table-driven.ts
    expectedFindings:
      - text: |-
          describe("parseNumber", () => {
            test("1を変換できること", () => {
              const result = parseNumber("1");

              expect(result).toBe(1);
            });

            test("2を変換できること", () => {
              const result = parseNumber("2");

              expect(result).toBe(2);
            });
          });
