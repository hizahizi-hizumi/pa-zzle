name: Setup Node
description: ChatGPT実行環境と同じNodeメジャーバージョンをセットアップします。

runs:
  using: composite
  steps:
    - name: Resolve Node major version
      id: node
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source .github/actions/offline-dependencies/inputs.env
        echo "major=$NODE_MAJOR" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.node.outputs.major }}
        package-manager-cache: false
