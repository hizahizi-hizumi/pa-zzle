name: Semantic Lint Few Shot Repository

on:
  push:
    branches:
      - experiment/semantic-lint-few-shot-repository-20260922

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install semantic lint dependencies
        working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile

      - name: Run repository validation with few-shot
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint poc -- candidate-anchor --benchmark .semantic-lint/poc/benchmark-few-shot.yaml --repository
