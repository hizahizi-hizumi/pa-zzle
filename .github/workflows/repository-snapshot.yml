  cleanup-repository-snapshot:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout closed PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Delete closed PR Repository Snapshot artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TARGET: pr-${{ github.event.pull_request.number }}
        run: .github/workflows/scripts/prune-repository-snapshot-artifacts.sh "$SNAPSHOT_TARGET"

