name: Repository Snapshot

on:
  # pull_request:
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
  #     - closed
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: repository-snapshot-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      target-sha: ${{ steps.target.outputs.sha }}
      # dependency-build-needed: ${{ steps.dependencies.outputs.build }}
    steps:
      - name: Resolve snapshot target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          snapshot_base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            snapshot_target="pr-${PR_NUMBER}"
            snapshot_sha="$PR_HEAD_SHA"
            snapshot_base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            snapshot_target="dispatch"
            snapshot_sha="$GITHUB_SHA"
          else
            snapshot_target="main"
            snapshot_sha="$GITHUB_SHA"
          fi

          if [[ ! "$snapshot_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a 40-character commit SHA, got: $snapshot_sha" >&2
            exit 1
          fi
          if [[ -n "$snapshot_base_sha" && ! "$snapshot_base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a 40-character base SHA, got: $snapshot_base_sha" >&2
            exit 1
          fi

          echo "target=$snapshot_target" >> "$GITHUB_OUTPUT"
          echo "sha=$snapshot_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$snapshot_base_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Build snapshot
        id: snapshot
        uses: ./.github/actions/repository-snapshot
        with:
          target: ${{ steps.target.outputs.target }}
          sha: ${{ steps.target.outputs.sha }}

      - name: Build git bundle
        id: bundle
        uses: ./.github/actions/repository-bundle
        with:
          target: ${{ steps.target.outputs.target }}
          sha: ${{ steps.target.outputs.sha }}
          base-sha: ${{ steps.target.outputs.base_sha }}

      - name: Upload snapshot
        id: upload-snapshot
        uses: actions/upload-artifact@v7
        with:
          # With archive=false, upload-artifact uses this file name as the artifact name.
          name: ${{ steps.snapshot.outputs.archive }}
          path: ${{ steps.snapshot.outputs.archive }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload git bundle
        id: upload-bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.bundle }}
          path: ${{ steps.bundle.outputs.bundle }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Prune obsolete Repository Snapshot artifacts
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TARGET: ${{ steps.target.outputs.target }}
          SNAPSHOT_SHA: ${{ steps.target.outputs.sha }}
          SNAPSHOT_ARTIFACT_ID: ${{ steps.upload-snapshot.outputs.artifact-id }}
          BUNDLE_ARTIFACT_ID: ${{ steps.upload-bundle.outputs.artifact-id }}
        run: >-
          .github/workflows/scripts/prune-repository-snapshot-artifacts.sh
          "$SNAPSHOT_TARGET"
          "$SNAPSHOT_SHA"
          "$SNAPSHOT_ARTIFACT_ID"
          "$BUNDLE_ARTIFACT_ID"

      # Offline Dependencies は pa-zzle 向けの移植が完了するまで手動で無効化しておく。
