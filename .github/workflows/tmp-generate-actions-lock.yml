name: Generate Actions Lockfile (temporary)

on:
  push:
    branches:
      - claude/charming-cerf-b75x16-actions-lock

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: >-
          gh actions-lock --migrate-local-actions
          .github/workflows/quality-gate.yml
          .github/workflows/repository-snapshot.yml
          .github/workflows/shadcn-fetch.yml
          .github/workflows/verify-actions-lock.yml
      - run: |
          git add -A
          git status --short
          echo "PATCH-BEGIN"
          git diff --cached --binary | gzip -9 | base64 -w0
          echo
          echo "PATCH-END"
