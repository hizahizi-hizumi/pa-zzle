name: Dependabot Auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # 基準と理由は ADR-0004。マージ自体は必須チェックが通ってから GitHub が行う。
      - name: Enable auto-merge for eligible updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -euo pipefail

          official_owners=(actions github dependabot)
          # 自動マージした更新で問題を起こしたアクションを owner/repo で載せる。
          excluded_actions=()

          skip() {
            echo "Auto-merge skipped: $*"
            exit 0
          }

          [[ "$PACKAGE_ECOSYSTEM" == "github_actions" ]] || skip "ecosystem is ${PACKAGE_ECOSYSTEM:-unknown}"
          case "$UPDATE_TYPE" in
            version-update:semver-minor | version-update:semver-patch) ;;
            *) skip "update type is ${UPDATE_TYPE:-unknown}" ;;
          esac

          IFS=',' read -r -a dependency_names <<< "$DEPENDENCY_NAMES"
          (( ${#dependency_names[@]} > 0 )) || skip "no dependencies found"
          for raw_name in "${dependency_names[@]}"; do
            name="$(xargs <<< "$raw_name")"
            owner="${name%%/*}"
            repo_path="${name#*/}"
            action="$owner/${repo_path%%/*}"

            [[ " ${official_owners[*]} " == *" $owner "* ]] || skip "$name is not published by GitHub"
            [[ " ${excluded_actions[*]} " != *" $action "* ]] || skip "$action is excluded"
          done

          gh pr merge --auto --merge "$PR_URL"
