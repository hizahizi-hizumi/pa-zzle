name: Semantic Lint Selector First PoC

on:
  push:
    branches:
      - experiment/semantic-lint-selector-first-20260922

permissions:
  contents: read

jobs:
  selector-first:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install semantic lint dependencies
        working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile

      - name: Plan Selector First PoC
        run: bun run --cwd tools/semantic-lint poc -- selector-first --plan-only

      - name: Run Selector First PoC
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint poc -- selector-first --repeat 3
