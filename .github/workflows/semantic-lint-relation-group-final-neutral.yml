name: Semantic Lint Relation Group Final Neutral

on:
  push:
    branches:
      - experiment/semantic-lint-relation-group-final-neutral-20260923

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install semantic lint dependencies
        working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile
      - name: Run final relation benchmark
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint poc -- relation-group-only --benchmark .semantic-lint/poc/relation-group/final.yaml --repeat 10
