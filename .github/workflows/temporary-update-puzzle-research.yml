name: Temporary update puzzle research

on:
  push:
    branches:
      - docs/puzzle-candidate-priority-20260914

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/puzzle-candidate-priority-20260914

      - name: Update puzzle research facts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/立ち上げ/パズル調査.md')
          text = path.read_text()
          marker = '\n---\n\n## 評価記号\n'
          heading = '## 調査前に確認できる外部事実'

          if heading in text:
              raise SystemExit('facts section already exists')
          if marker not in text:
              raise SystemExit('insertion marker not found')

          section = r'''
---

## 調査前に確認できる外部事実

成立性調査の前でも確認できる事実として、代表的なモバイルアプリのストア表示値を記録する。

確認日: 2026-09-14

- Google Play のダウンロード数は `1億+` のような累積の帯表示であり、現在の利用者数ではない。
- Google Play のレビュー件数と日本 App Store の評価件数は、それぞれ別ストアの累積値であり、直接同じ母集団として比較できない。
- 各行の数値はパズル形式全体の合計ではなく、確認できた代表アプリ1本の値である。
- 数値の大小だけで採用可否や調査優先度を決めない。
- 行順は優先度を表さない。

| パズル | Google Play 代表例 | ダウンロード | レビュー件数 | 日本 App Store 代表例 | 評価件数 | 補足 |
|---|---|---:|---:|---|---:|---|
| ナンプレ | [Sudoku.com](https://play.google.com/store/apps/details?id=com.easybrain.sudoku.android&hl=ja) | 1億+ | 249万 | [ナンプレ - 数字パズルゲーム](https://apps.apple.com/jp/app/id1193508329) | 57万 | 基準として記録 |
| カラーウォーターソート | [Water Sort Puzzle](https://play.google.com/store/apps/details?id=com.gma.water.sort.puzzle&hl=ja) | 1億+ | 134万 | [Water Sort Puzzle](https://apps.apple.com/jp/app/id1514542157) | 2.4万 | 基準として記録。Google Play には別タイトルでも1,000万+規模の例が複数ある |
| パーキングジャム | [Parking Jam 3D](https://play.google.com/store/apps/details?id=com.lszenlamzr.parkingjam&hl=ja) | 1億+ | 177万 | [Parking Jam 3D](https://apps.apple.com/jp/app/id1498229533) | 11万 | 同一タイトルを両ストアで確認 |
| マインスイーパー | [マインスイーパ](https://play.google.com/store/apps/details?id=Draziw.Button.Mines&hl=ja) | 1,000万+ | 39.9万 | [マインスイーパー ZERO](https://apps.apple.com/jp/app/id1148271673) | 2.4万 | ストア間で代表アプリは別タイトル |
| ノノグラム / イラストロジック | [Nonogram.com](https://play.google.com/store/apps/details?id=com.easybrain.nonogram&hl=ja) | 5,000万+ | 90.1万 | [Nonogram.com](https://apps.apple.com/jp/app/id1452992954) | 6.3万 | 同系列の代表アプリを両ストアで確認 |
| ナンバーリンク / 経路接続 | [Flow Free](https://play.google.com/store/apps/details?id=com.bigduckgames.flow&hl=ja) | 1億+ | 155万 | [Flow Free](https://apps.apple.com/jp/app/id526641427) | 1,242 | `Flow` / `Flow Free` は Big Duck Games の登録商標。経路接続型の代表アプリとして記録 |
| ブロック脱出 | [Unblock Me](https://play.google.com/store/apps/details?id=com.kiragames.unblockmefree&hl=ja) | 5,000万+ | 69万 | [Unblock Me](https://apps.apple.com/jp/app/id315019111) | 1,713 | 同一タイトルを両ストアで確認 |
| パイプパズル | [Water Pipes](https://play.google.com/store/apps/details?id=com.mobiloids.waterpipespuzzle&hl=ja) | 1,000万+ | 3.63万 | - | - | 同一ルール・同一タイトルとして比較できる日本 App Store 代表例は未確認 |
| 迷路 | [迷路: エンドレスで簡単](https://play.google.com/store/apps/details?id=com.rikudogames.maze&hl=ja) | 1,000万+ | 14.5万 | [迷路：光の道](https://apps.apple.com/jp/app/id1592163826) | 100 | 同一開発元の迷路アプリを両ストアで確認 |
| タクズ / バイナリパズル | [Mr. Binairo - Binary Sudoku](https://play.google.com/store/apps/details?id=com.Appsparagus.MrBinairo.app&hl=ja) | 10万+ | 954 | [Binario: Takuzu Binary Puzzle](https://apps.apple.com/jp/app/id6759195276) | - | Google Play / App Store の説明で Binairo / Takuzu 等の呼称を確認。日本 App Store は評価件数表示なし |
| Hidato | [Hidato](https://play.google.com/store/apps/details?id=com.hidato.app&hl=ja) | - | - | - | - | Google Play に同名アプリは確認できたが、比較可能な表示値と日本 App Store 代表例は今回確定していない |

この表は市場規模そのものを測るものではなく、成立性調査前に確認できる外部事実を残すためのものとする。
'''

          path.write_text(text.replace(marker, '\n' + section + marker, 1))
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/立ち上げ/パズル調査.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: パズル調査に外部事実を追加"
          git push origin HEAD:docs/puzzle-candidate-priority-20260914
