name: Temporary update puzzle research

on:
  push:
    branches:
      - docs/puzzle-candidate-priority-20260914

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/puzzle-candidate-priority-20260914

      - name: Update puzzle research facts
        env:
          FACTS_BASE64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('docs/立ち上げ/パズル調査.md')
          text = path.read_text()
          heading = '## 調査前に確認できる外部事実'
          marker = '\n---\n\n## 評価記号\n'
          if heading in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit('insertion marker not found')
          section = base64.b64decode(__import__('os').environ['FACTS_BASE64']).decode()
          path.write_text(text.replace(marker, '\n' + section + marker, 1))
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/立ち上げ/パズル調査.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: パズル調査に外部事実を追加"
          git push origin HEAD:docs/puzzle-candidate-priority-20260914
