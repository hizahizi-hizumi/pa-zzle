name: Semantic Lint Redesign Benchmark

on:
  push:
    branches:
      - claude/semantic-lint-progress-iofkaj

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile
      - run: bun run --cwd tools/semantic-lint typecheck
      - run: bun run --cwd tools/semantic-lint test
      - run: bun run --cwd tools/semantic-lint doctor

  benchmark:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A-scope
            args: ""
          - name: B-unit
            args: "--rules-from vitest-unit"
          - name: B-unit-locate-judge
            args: "--rules-from vitest-unit --locate judge"
          - name: B-unit-line
            args: "--rules-from vitest-unit-line"
          - name: B-unit-nesting-all
            args: "--rules-from vitest-unit --nesting all"
          - name: B-unit-locate-statements
            args: "--rules-from vitest-unit --locate statements"
          - name: B-unit-context-file
            args: "--rules-from vitest-unit --context file"
    name: benchmark (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile
      - name: Benchmark against repository golden
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          bun run --cwd tools/semantic-lint bench -- ${{ matrix.args }} --repeat 3 --format json \
            > "$RUNNER_TEMP/${{ matrix.name }}.json"
      - name: Render report
        working-directory: tools/semantic-lint
        run: |
          bun -e '
            import { renderBenchmarkReport } from "./eval/benchmark-report.ts";
            const report = await Bun.file(process.env.REPORT_PATH).json();
            process.stdout.write(renderBenchmarkReport(report));
          '
        env:
          REPORT_PATH: ${{ runner.temp }}/${{ matrix.name }}.json
      - name: Summary
        working-directory: tools/semantic-lint
        run: |
          bun -e '
            import { renderBenchmarkSummary } from "./eval/benchmark-report.ts";
            const report = await Bun.file(process.env.REPORT_PATH).json();
            process.stdout.write(renderBenchmarkSummary(report));
          '
        env:
          REPORT_PATH: ${{ runner.temp }}/${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.json

  summary:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: ${{ runner.temp }}/reports
          merge-multiple: true
      - name: Summarize all variants
        working-directory: tools/semantic-lint
        run: |
          bun -e '
            import { readdir } from "node:fs/promises";
            import { renderBenchmarkSummary } from "./eval/benchmark-report.ts";
            const dir = process.env.REPORTS_DIR;
            for (const name of (await readdir(dir)).sort()) {
              const report = await Bun.file(`${dir}/${name}`).json();
              process.stdout.write(`## ${name}\n` + renderBenchmarkSummary(report));
            }
          '
        env:
          REPORTS_DIR: ${{ runner.temp }}/reports
