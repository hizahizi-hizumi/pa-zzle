name: Temporary run puzzle market facts fill

on:
  push:
    branches:
      - docs/puzzle-candidate-priority-20260914

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/puzzle-candidate-priority-20260914

      - name: Run fill script from temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/temporary-fill-market-facts.yml').read_text().splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          Path('/tmp/fill-market-facts.py').write_text(script)
          PY
          python /tmp/fill-market-facts.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/立ち上げ/パズル調査.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: 市場実績の未確認を解消"
          git push origin HEAD:docs/puzzle-candidate-priority-20260914
