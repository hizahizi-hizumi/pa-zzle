name: Quality Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Apply Biome fixes
        if: github.event_name == 'pull_request'
        run: |
          cd frontend
          bunx biome check . --write --unsafe || true
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if ! git diff --cached --quiet; then
            git commit -m "style(frontend): Biomeの指摘を修正"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Verify repository quality
        run: ./scripts/verify.sh
