name: Quality Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # vite / vitest / tsc はNodeで動くため、ランナー既定ではなくChatGPT実行環境と同じNodeに固定する。
      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install semantic lint dependencies
        working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile

      - name: Verify repository quality
        run: ./scripts/verify.sh

      # semantic lintはprovider課金を抑えるため、mainへのpushと手動実行でだけ動かす。
      - name: Restore semantic lint cache
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .semantic-lint/.cache
          key: semantic-lint-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            semantic-lint-v2-

      - name: Run semantic lint
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint check

      # provider応答ごとに追記した判定を、lintが失敗した実行でも次回へ引き継ぐ。
      - name: Save semantic lint cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .semantic-lint/.cache
          key: semantic-lint-v2-${{ github.run_id }}-${{ github.run_attempt }}
