name: Quality Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # vite / vitest / tsc はNodeで動くため、ランナー既定ではなくChatGPT実行環境に合わせた.node-versionに固定する。
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Verify repository quality
        run: ./scripts/verify.sh
