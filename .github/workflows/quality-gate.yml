name: Quality Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Apply hook fix
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/games/water-sort/ui/WaterSortBoard.tsx')
          text = path.read_text()
          old = '''  const finishPresentationsForBottle = (bottleIndex: number) => {
            setPourPresentations((current) =>
              current.filter(
                (presentation) =>
                  presentation.sourceBottleIndex !== bottleIndex &&
                  presentation.destinationBottleIndex !== bottleIndex,
              ),
            );
          };'''
          new = '''  const finishPresentationsForBottle = useCallback((bottleIndex: number) => {
            setPourPresentations((current) =>
              current.filter(
                (presentation) =>
                  presentation.sourceBottleIndex !== bottleIndex &&
                  presentation.destinationBottleIndex !== bottleIndex,
              ),
            );
          }, []);'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cd frontend
          bunx biome check . --write
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/games/water-sort/ui/WaterSortBoard.tsx
          git commit -m "fix(frontend): 注水演出のeffect依存を安定化"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Verify repository quality
        run: ./scripts/verify.sh
