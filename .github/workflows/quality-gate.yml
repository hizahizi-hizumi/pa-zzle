name: Quality Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install semantic lint dependencies
        working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile

      - name: Verify repository quality
        run: ./scripts/verify.sh

      - name: Restore semantic lint cache
        uses: actions/cache/restore@v6
        with:
          path: .semantic-lint/.cache
          key: semantic-lint-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            semantic-lint-v1-

      - name: Run semantic lint
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint check

      # provider応答ごとに追記した判定を、lintが失敗した実行でも次回へ引き継ぐ。
      - name: Save semantic lint cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .semantic-lint/.cache
          key: semantic-lint-v1-${{ github.run_id }}-${{ github.run_attempt }}
