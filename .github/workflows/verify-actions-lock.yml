name: Verify Actions Lockfile

on:
  push:
    branches:
      - claude/charming-cerf-b75x16-automerge-lockgen

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0

      - name: Verify actions.lock
        run: |
          gh actions-lock --migrate-local-actions
          git add -A
          git status --short
          echo "PATCH-BEGIN"
          git diff --cached --binary -- . ':!.github/workflows/verify-actions-lock.yml' | gzip -9 | base64 -w0
          echo
          echo "PATCH-END"
