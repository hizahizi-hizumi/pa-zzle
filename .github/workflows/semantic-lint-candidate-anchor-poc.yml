name: Semantic Lint Candidate Anchor PoC

on:
  push:
    branches:
      - experiment/semantic-lint-candidate-anchor-20260922

permissions:
  contents: read

jobs:
  candidate-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install semantic lint dependencies
        working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile

      - name: Plan Candidate Anchor PoC
        run: bun run --cwd tools/semantic-lint poc -- candidate-anchor --plan-only

      - name: Run Candidate Anchor PoC
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint poc -- candidate-anchor --repeat 3
