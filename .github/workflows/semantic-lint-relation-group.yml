name: Semantic Lint Relation Group

on:
  push:
    branches:
      - experiment/semantic-lint-relation-group-20260922

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install semantic lint dependencies
        working-directory: tools/semantic-lint
        run: bun install --frozen-lockfile

      - name: Run tuned benchmark verbose
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint poc -- relation-group --benchmark .semantic-lint/poc/benchmark.yaml --repeat 1 --verbose

      - name: Run holdout benchmark verbose
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint poc -- relation-group --benchmark .semantic-lint/poc/holdout/benchmark.yaml --repeat 1 --verbose

      - name: Reduce repository batch size
        run: sed -i 's/maxDecisionsPerRequest: 64/maxDecisionsPerRequest: 16/' .semantic-lint/config.yaml

      - name: Run repository validation batch16
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run --cwd tools/semantic-lint poc -- relation-group --benchmark .semantic-lint/poc/benchmark.yaml --repository
