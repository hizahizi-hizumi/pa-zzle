name: Temporary integrate puzzle market facts

on:
  push:
    branches:
      - docs/puzzle-candidate-priority-20260914

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/puzzle-candidate-priority-20260914

      - name: Repair market facts column separators
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/立ち上げ/パズル調査.md')
          text = path.read_text()
          marker18 = '# 18. ゲーム性要素との親和性（初期版選定用）'
          marker19 = '# 19. 初期版で「実装」と「記録」を分ける案'
          before, rest = text.split(marker18, 1)
          section18, after = rest.split(marker19, 1)

          repaired = []
          for line in section18.splitlines():
              if '| 初期版  市場実績（代表例） |' in line:
                  line = line.replace('| 初期版  市場実績（代表例） |', '| 初期版 | 市場実績（代表例） |')
              elif '|---:---|' in line:
                  line = line.replace('|---:---|', '|---:|---|')
              elif line.startswith('|') and line.endswith('|') and '  ' in line.split('|')[-2]:
                  cells = line.split('|')
                  left, right = cells[-2].split('  ', 1)
                  cells[-2] = left + ' '
                  cells.insert(-1, ' ' + right)
                  line = '|'.join(cells)
              repaired.append(line)

          path.write_text(before + marker18 + '\n'.join(repaired) + marker19 + after)
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/立ち上げ/パズル調査.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: 市場実績列の区切りを修正"
          git push origin HEAD:docs/puzzle-candidate-priority-20260914
