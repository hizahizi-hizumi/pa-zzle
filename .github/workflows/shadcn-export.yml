name: Export shadcn Components

on:
  push:
    branches:
      - automation/shadcn-export-interaction-20260920

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Fetch shadcn components
        run: |
          set -euo pipefail
          bunx --bun shadcn@latest add dialog dropdown-menu collapsible --cwd frontend --yes

      - name: Apply app integration patch
        shell: bash
        env:
          APP_PATCH_GZ_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$APP_PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/app.patch
          git apply /tmp/app.patch

      - name: Export final changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A frontend
          git diff --cached --name-status
          while IFS= read -r -d '' file
          do
            status="$(git diff --cached --name-status -- "$file" | cut -f1)"
            if [[ "$status" == D* ]]; then
              echo "DELETE_FILE $file"
              continue
            fi
            echo "BEGIN_FILE $file"
            base64 -w0 "$file"
            echo
            echo "END_FILE $file"
          done < <(git diff --cached --name-only -z -- frontend)
