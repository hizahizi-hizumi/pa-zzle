          section, after = rest.split(end_marker, 1)

          out = []
          fallback_names = []
          for line in section.splitlines():
              if line.startswith('|') and not line.startswith('|---') and not line.startswith('| パズル |'):
                  cells = [cell.strip() for cell in line.strip().strip('|').split('|')]
