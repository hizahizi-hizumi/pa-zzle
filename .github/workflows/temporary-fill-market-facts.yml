                      puzzle = cells[0]
                      value = facts.get(puzzle, fallback)
                      if puzzle not in facts:
                          fallback_names.append(puzzle)
                      cells[-1] = value
                      line = '| ' + ' | '.join(cells) + ' |'
              out.append(line)

          section = '\n'.join(out)
          if '未確認' in section:
              raise SystemExit('section 18 still contains 未確認')

